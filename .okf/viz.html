const NODES=[{"id": "agents/a2a-handoff", "type": "System", "title": "A2A Handoff \u2014 Supervisor to Diagnosis", "description": "The one real Agent-to-Agent protocol handoff in OpsFlow \u2014 a genuinely HMAC-signed, discoverable Agent Card, invoked over HTTP (in-process ASGI transport in this build) instead of a plain function call.", "tags": ["a2a", "protocol", "agents"], "group": "agents", "sz": 34, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/a2a/agent_card.py", "resource": "backend/a2a/agent_card.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}, {"title": "backend/a2a/client.py", "resource": "backend/a2a/client.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# Overview\n\nEvery other Supervisor \u003c-> specialist call in the chain is in-process, using the typed\n`SpecialistResult` Python contract directly. The Supervisor -> Diagnosis handoff is the one\ndeliberate exception, chosen as the most demo-prominent reasoning step \u2014 see\n[One A2A Handoff](/decisions/one-a2a-handoff.md) for why exactly one, not all of them.[^client-py]\n\n# Agent Card\n\n```json\n{\n  \"name\": \"diagnosis-agent\",\n  \"description\": \"Root-cause hypothesis generation & ranking...\",\n  \"capabilities\": [\"generate_diagnosis\"],\n  \"endpoint\": \"http://localhost:9010/invoke\",\n  \"signature\": \"\u003chex HMAC-SHA256 over the other 4 fields, canonical JSON, sorted keys>\"\n}\n```\n\nThe signature is a real, verifiable HMAC-SHA256 over the canonical (sorted-key) JSON of the other 4\nfields, keyed by a local-only secret (`A2A_SECRET`) \u2014 `verify_agent_card()` rejects any tampered\nfield. This is explicitly documented as a hackathon-scope simplification: a production deployment\nwould use asymmetric/PKI signing, not a shared local secret.[^agent-card-py]\n\n# Discovery and invocation\n\n- **Discovery**: `GET /.well-known/agent-card.json`.\n- **Invocation**: `POST /invoke` with `{incident_id, evidence}`, returning a `SpecialistResult`.\n\n`backend/a2a/endpoint.py` runs the real Diagnosis agent behind this HTTP surface (standalone on\nport 9010, or via in-process ASGI transport for tests/dev \u2014 `backend/a2a/client.py`'s\n`wire_in_process()` mounts `a2a/endpoint.py`'s FastAPI app directly onto an `httpx.AsyncClient`, no\nreal socket needed). The Supervisor calls `invoke_diagnosis_via_a2a()` instead of calling\n[Diagnosis](diagnosis-agent.md) as a plain Python function \u2014 this is the one place `transport` on\n`SpecialistResult` is set to `\"a2a\"` rather than the default `\"in_process\"`.[^client-py]\n\n# Runs locally, calls nothing outbound\n\nBoth the MCP layer and this A2A endpoint run locally and call nothing outbound \u2014 the pre-empt line\nfor the \"gateway vs. external system\" distinction: OpsFlow's own protocol implementations are local\ninfrastructure, not a dependency on a third-party service.\n\n[^agent-card-py]: backend/a2a/agent_card.py\n[^client-py]: backend/a2a/client.py"}, {"id": "agents/diagnosis-agent", "type": "Module", "title": "Diagnosis Agent", "description": "LLM-driven root-cause hypothesis generation and ranking, invoked over the one real A2A handoff, with hard citation enforcement \u2014 an uncited or out-of-bundle hypothesis is dropped before it is ever returned.", "tags": ["agents", "llm", "citation"], "group": "agents", "sz": 32, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/agents/diagnosis.py", "resource": "backend/agents/diagnosis.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}], "body": "# Overview\n\n`run_diagnosis(incident_id, evidence)` prompts the active provider's `reasoning`-role model (see\n[Provider Registry](/architecture/provider-registry.md)) with the evidence bundle (IDs + extracts\nonly) and asks for 2-4 ranked root-cause hypotheses as JSON. It is the one step in the whole chain\ngenuinely needing multi-step reasoning over conflicting evidence, and the one step invoked over\n[A2A](a2a-handoff.md) instead of a plain in-process call.[^diagnosis-py]\n\n# Citation enforcement\n\n`_parse_and_filter()` drops any hypothesis whose `cited_artifact_ids` is empty, or which cites an\nID outside the actual evidence bundle passed in \u2014 functionally \"suppressed at generation,\" never a\ndownstream filter applied after the fact. Surviving hypotheses are sorted by confidence,\ndescending.[^diagnosis-py]\n\n# Retry and termination\n\nRuns inside a `TurnTracker` loop (cap 3): a JSON-parse failure retries (consuming a turn) rather\nthan failing immediately, since a model occasionally wraps its JSON in markdown fences or similar \u2014\nhandled defensively before falling back to `termination_reason = TERMINATION_CAP_EXCEEDED`. Calls\n`llm.ainvoke()` (async), not the synchronous `.invoke()` \u2014 see\n[No Workflow Checkpointing](/decisions/no-workflow-checkpointing.md)'s sibling bug in\n[Planner](planner-agent.md) for why a sync call here would matter (it blocked uvicorn's whole event\nloop for the length of this call).\n\n# Consumers\n\n[Supervisor](supervisor.md) takes `result[\"hypotheses\"][0]` (the top-ranked hypothesis) as\n[Planner](planner-agent.md)'s input; an empty hypothesis list stops the workflow with\n`stopped`/`no_valid_hypotheses`.\n\n[^diagnosis-py]: backend/agents/diagnosis.py"}, {"id": "agents/enrichment-agent", "type": "Module", "title": "Enrichment Agent", "description": "Deterministic evidence gathering across MCP-exposed simulated systems plus one real Chroma/RAG lookup for ticket-history precedent \u2014 no LLM call.", "tags": ["agents", "evidence", "rag"], "group": "agents", "sz": 31, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/agents/enrichment.py", "resource": "backend/agents/enrichment.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}], "body": "# Overview\n\n`run_enrichment(incident_id, ci_id, alerts, workflow_type)` gathers evidence by calling\n[MCP tools](/tools/mcp-tool-layer.md) \u2014 CMDB facts + relationships, monitoring metric-series trend,\nand for patch workflows, pending patches + change-calendar blackouts \u2014 plus one real\nretrieval-augmented lookup: `orchestrator/retrieval.py`'s `query_collection(\"ticket_history\", ...)`,\nreturning the top-2 nearest past tickets as \"precedent\" evidence, each confidence-scored from\nvector distance.[^enrichment-py] No LLM call \u2014 pulling facts and doing a similarity search is not a\nreasoning task, per [Model Routing](/architecture/model-routing.md).\n\n# Evidence shape and token discipline\n\nEvery fact gets a stable `artifact_id` (e.g. `CI-0087`, `ALERT-1043`, `PATCHINV-CI-0059`) so later\nagents cite it by ID rather than re-stating it. Extracts are truncated to 240 characters \u2014\ndownstream agents see IDs + short extracts, never whole documents, per the tier architecture's\ntoken-discipline strategy.\n\n# Graceful degradation\n\nMetrics, patch/change-calendar, and precedent lookups are each wrapped in a bare `except Exception:\npass` \u2014 a missing metric series, an unreachable patch simulator, or an unavailable Chroma/embedding\ncall each degrade the evidence bundle rather than crashing the whole workflow.[^enrichment-py]\n\n# Consumers\n\n[Diagnosis Agent](diagnosis-agent.md) receives `result[\"evidence\"]` as its prompt input;\n[Supervisor](supervisor.md) treats an empty evidence list (or a hit turn cap) as\n`stopped`/`enrichment_failed`.\n\n[^enrichment-py]: backend/agents/enrichment.py"}, {"id": "agents/knowledge-agent", "type": "Module", "title": "Knowledge Agent", "description": "Only acts on a symptom_suppressed outcome \u2014 seeds a Negative KB entry scoped to (ci_class, failure_signature) so a remediation that failed once is remembered, never a blanket filter. Deterministic, no LLM.", "tags": ["agents", "negative-kb"], "group": "agents", "sz": 27, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/agents/knowledge.py", "resource": "backend/agents/knowledge.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}], "body": "# Overview\n\n`run_knowledge(incident_id, ci_class, verification_status, failure_signature, attempted_fix)` is a\nno-op for every outcome except `symptom_suppressed` (see\n[Verification Agent](verification-agent.md)). On that outcome it inserts a row into\n`negative_kb_entries` scoped to `(ci_class, failure_signature)` \u2014 recording what was tried, and\nthat it failed to actually hold, so future planning can be warned about it.[^knowledge-py]\n\n# Why scoped narrow\n\nDeliberately scoped to CI class + failure signature, never a blanket \"this fix never works\" filter\n\u2014 see [Bias Mitigation](/guardrails/bias-mitigation.md)'s \"Negative-KB overcorrection\" row. A\nremediation that failed once in one context should not be silently suppressed everywhere.\n\n[^knowledge-py]: backend/agents/knowledge.py"}, {"id": "agents/planner-agent", "type": "Module", "title": "Planner Agent", "description": "Drafts a remediation/patch/tuning plan strictly from retrieved runbook chunks (runbook-bounded action space), then computes blast radius, the policy-gate decision, and (for patch workflows) a maintenance window \u2014 all three deterministically, never by the model.", "tags": ["agents", "llm", "rag", "guardrails"], "group": "agents", "sz": 31, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/agents/planner.py", "resource": "backend/agents/planner.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}], "body": "# Overview\n\n`run_planner(incident_id, ci, runbook_class, hypothesis, actor_role)` first does a real Chroma\nvector search \u2014 `query_collection(\"runbooks\", query_text, where={\"class\": runbook_class})` \u2014 scoped\nto the workflow's runbook class, retrieving up to 4 chunks. It then prompts the active provider's\n`structured`-role model to draft a plan **using only those retrieved chunks**; `_parse_and_filter_steps()`\ndrops any step citing a chunk ID that wasn't actually retrieved \u2014 the same bounded-action-space\npattern as [Diagnosis](diagnosis-agent.md)'s citation enforcement.[^planner-py]\n\n# Deterministic guardrails, computed after the LLM drafts\n\nThree things are computed purely deterministically, never delegated to the model:\n\n1. **Blast radius** \u2014 `guardrails/blast_radius.py`, BFS over the CMDB adjacency graph.\n2. **Policy-gate decision** \u2014 `guardrails/policy_gate.py`, threshold rules over blast radius,\n   environment, criticality, and actor role.\n3. **Maintenance window** (`runbook_class == \"patching\"` only) \u2014 `guardrails/scheduling.py`,\n   dependency- and blackout-aware scheduling. See [Guardrails](/guardrails/) for all three.\n\n# Consumers\n\n[Supervisor](supervisor.md) reads `result[\"policy_gate_result\"][\"decision\"]` to decide whether the\nworkflow blocks, pauses for human approval, or proceeds; a `block` decision stops the workflow\nentirely. `IncidentWorkspace.jsx`'s Maintenance Planner panel renders `result[\"maintenance_window\"]`\nonly when `workflow_type === \"patch\"`.\n\n[^planner-py]: backend/agents/planner.py"}, {"id": "agents/supervisor", "type": "Module", "title": "Supervisor", "description": "The dispatch loop that runs one workflow \u2014 calls each specialist in order, re-validates its typed result, enforces the policy gate and human-approval pause, and writes every step to the audit log.", "tags": ["orchestration", "agents"], "group": "agents", "sz": 38, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/orchestrator/supervisor.py", "resource": "backend/orchestrator/supervisor.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-08"}, {"title": "Domain \u2014 Agent Chain & Orchestration", "resource": ".knowledge/domain-agents.md", "cid": "agents/.knowledge/domain-agents", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# Overview\n\n`run_workflow(incident_id, ci, alerts, workflow_type, actor_role, auto_approve)` is the one entry\npoint that runs a full incident/patch/performance-tuning workflow. It loads a declarative workflow\nYAML (see [Workflow Families](/workflows/workflow-families.md)), then calls specialists in a fixed\norder, wrapping each in `_timed()` so the [Agent Trace Viewer](/architecture/cockpit-ui.md) gets\nreal latency/transport data, and re-validates every result via `SpecialistResult.model_validate()`\nbefore trusting it \u2014 the way it would have to if a specialist crossed a real process boundary.[^supervisor-py]\n\n# Chain order\n\nCorrelate (audit marker only \u2014 the real DBSCAN correlation ran earlier, see\n[Model Routing](/architecture/model-routing.md)) -> [Enrichment](enrichment-agent.md) ->\n[Diagnosis](diagnosis-agent.md) (the one [A2A handoff](a2a-handoff.md)) ->\n[Planner](planner-agent.md) (computes blast radius + policy gate internally) -> **Approval** (human\ndecision point, not code) -> **Execute** (audit-log-only; no real script execution) ->\n[Verification](verification-agent.md) -> [Sync](sync-agent.md) -> [Knowledge](knowledge-agent.md).\n\nSteps that are NOT separate schema-validated specialists: `correlate` (the Supervisor receives an\nalready-clustered alert group), `policy_gate` (computed inside Planner's result), `approval` (a\nhuman decision \u2014 the workflow returns `status: \"pending_approval\"` and pauses unless\n`auto_approve=True`), `execute` (Supervisor-internal audit entry only).[^supervisor-py]\n\n# Early exits\n\nThe workflow can stop before completion at several points, each with an explicit\n`status`/`reason`: `stopped`/`enrichment_failed` (no evidence gathered or turn cap hit),\n`stopped`/`no_valid_hypotheses` (Diagnosis returned nothing citable), `blocked`/`\u003cpolicy reasons>`\n(the policy gate hard-blocked), or `pending_approval` (needs a human decision and\n`auto_approve` wasn't set).\n\n# Two levels only\n\nSpecialists never call each other directly \u2014 every specialist returns a typed `SpecialistResult`\n(see `backend/orchestrator/contracts.py`) to the Supervisor, which validates it against the schema\nbefore dispatching the next agent.[^domain-agents] See\n[Two-Level Supervisor](/decisions/two-level-supervisor.md) for why this topology was chosen over a\ndeeper hierarchy or a free agent mesh.\n\n# Turn caps\n\nEvery specialist uses a `TurnTracker` (`backend/orchestrator/limits.py`) with a per-agent hard cap\n(enrichment 3, diagnosis 3, planner 2, verification 2, sync 1, knowledge 1). Exceeding the cap\nraises `TurnCapExceeded`, which the agent must catch and return as an explicit\n`termination_reason` \u2014 never let it propagate as an unhandled crash. This encodes an external\nfinding that more agent turns are not reliably better.\n\n[^supervisor-py]: backend/orchestrator/supervisor.py\n[^domain-agents]: Domain \u2014 Agent Chain & Orchestration"}, {"id": "agents/sync-agent", "type": "Module", "title": "Sync Agent", "description": "Writes the workflow outcome back to the simulated ITSM system as a work note + status update, and on a verified fix, proposes (never applies) a CMDB field update \u2014 one consistent record across systems. Deterministic, no LLM.", "tags": ["agents", "itsm", "cmdb"], "group": "agents", "sz": 28, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/agents/sync.py", "resource": "backend/agents/sync.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}], "body": "# Overview\n\n`run_sync(incident_id, sys_id, ci_id, verification_status, plan)` always writes a work note\nsummarizing the verification status and plan (`itsm_mcp.add_work_note`) and moves the ticket to a\nServiceNow-style resolved (`\"7\"`) or in-progress (`\"2\"`) state code\n(`itsm_mcp.update_ticket`).[^sync-py]\n\n# CMDB proposal, not a write\n\nOnly when `verification_status == \"verified_resolved\"` does it call `cmdb_mcp.propose_ci_update`,\nsetting `last_verified_at`. Per [MCP Tool Layer](/tools/mcp-tool-layer.md), this is a **proposal**\nrecorded by the CMDB simulator, not a direct write \u2014 a human approval step to actually apply it is\ndocumented as not yet built.\n\n# Consumers\n\nFeeds `local_tickets` (see [Database Schema](/data/database-schema.md)) via\n`main.py`'s `_persist_ticket_snapshot`, which mirrors the ITSM ticket's resulting state into a\nlocal, restart-durable record for the Tickets tab.\n\n[^sync-py]: backend/agents/sync.py"}, {"id": "agents/verification-agent", "type": "Module", "title": "Verification Agent \u2014 the Fake Fix Detector", "description": "Fully deterministic anti-reward-hacking check. Requires two independent signals \u2014 alert cleared AND the underlying metric held recovered through a stabilisation window \u2014 before trusting a fix as real.", "tags": ["agents", "guardrails", "verification"], "group": "agents", "sz": 32, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/agents/verification.py", "resource": "backend/agents/verification.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}, {"title": "Domain \u2014 Guardrails & Bias Mitigation", "resource": ".knowledge/domain-guardrails.md", "cid": "agents/.knowledge/domain-guardrails", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# Overview\n\n`run_verification(incident_id, alert_cleared, metric_series, metric_key, baseline_threshold)`\nchecks whether the underlying metric series **held** under threshold through the tail 30% of the\nseries (`_held_through_stabilisation_window`) \u2014 not just one recovered data point. It is entirely\ndeterministic; there is no LLM call anywhere in this module.[^verification-py]\n\n# Why this exists\n\nAn external IT-ops benchmark cited in the PRD found roughly 44% of \"solved\" mitigation problems in\nthat benchmark were actually a generic restart loop with no real fix \u2014 an alert that stops firing\nis not the same evidence as a system that actually recovered.[^domain-guardrails] Verification\nencodes that lesson as code: if only the alert cleared, without the metric holding recovered, the\noutcome is `symptom_suppressed` and the incident is treated as unresolved, not trusted as fixed.\n\n# Status outcomes\n\n| Status | Condition |\n|---|---|\n| `verified_resolved` | alert cleared **and** metric held recovered through the stabilisation window |\n| `symptom_suppressed` | alert cleared but the metric did **not** hold recovered |\n| `not_yet_resolved` | alert never cleared |\n\n# Consumers\n\n[Sync Agent](sync-agent.md) only proposes a CMDB update on `verified_resolved`.\n[Knowledge Agent](knowledge-agent.md) only seeds a Negative KB entry on `symptom_suppressed`. The\nOverview dashboard's \"Completed\" tile counts execution regardless of this status (see\n[Overview Metrics](/architecture/overview-metrics.md)) \u2014 deliberately not conflated with\n\"verified fixed.\"\n\n[^verification-py]: backend/agents/verification.py\n[^domain-guardrails]: Domain \u2014 Guardrails & Bias Mitigation"}, {"id": "architecture/cockpit-ui", "type": "System", "title": "Cockpit UI", "description": "The Next.js frontend \u2014 tab structure, the Agent Trace Viewer centerpiece, the three-badge trust system, the floating chat assistant, and accessibility requirements.", "tags": ["frontend", "ui"], "group": "architecture", "sz": 40, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "Frontend Rules & Commenting Standard", "resource": ".knowledge/rules-frontend.md", "cid": "architecture/.knowledge/rules-frontend", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}, {"title": "Decisions Log", "resource": ".knowledge/decisions-log.md", "cid": "architecture/.knowledge/decisions-log", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# Overview\n\nThe cockpit is explicitly a coordination-visibility tool, not a results panel or a chat-first\ninterface \u2014 its centerpiece is the **Agent Trace Viewer**, not a summary card.[^rules-frontend]\nCoordination between agents (handoffs, scrubbed prompts, model used, tokens, latency, validation\nresult, modality, in-process-vs-A2A transport) is meant to be visibly inspectable, not hidden\nbehind a single \"done\" state.\n\n# Tab structure\n\n`frontend/src/components/`: `CockpitShell` (shell + shared `useWorkflowRun` instance so one\nincident stays consistent across tabs), `Overview` (KPI dashboard, see\n[Overview Metrics](overview-metrics.md)), `OpsBoard` (live alert feed + click-to-diagnose),\n`IncidentWorkspace` (evidence/diagnosis/plan/approval for one incident, plus a Maintenance Planner\npanel for patch workflows), `AgentTrace`, `Tickets`, `ChunkInspector` (doubles as the Knowledge\nBase browser), `AutonomyLadder`, `ChatWidget` (floating assistant), `Sidebar` (role switcher, push-\nto-talk mic, admin panels), `NotificationBell`, `DriftQueue` (currently hidden from navigation, not\ndeleted).\n\n# Three-badge trust system\n\nNothing AI-generated shares the visual register of verified fact: an \"AI proposed\" / \"human\napproved\" / \"system verified\" badge distinguishes provenance on every claim, so a reviewer never\nhas to guess whether a number on screen came from a model, a human decision, or a deterministic\ncheck.[^rules-frontend] Every number click-throughs to its source artifact ID.\n\n# Floating chat assistant\n\nReverses an earlier \"no chatbot\" decision (voice was originally meant to be the sole conversational\nmodality) \u2014 see [Decisions](/decisions/) for the full reversal record.[^decisions-log] The chat's\nintent classifier is the only LLM call in the widget; everything the classifier's intent triggers\nis deterministic (`query_tickets` runs a real parameterized SQL query, never model-invented\nnumbers; `approve_incident`/`reject_incident` reuses the exact same audited, role-gated\n`/workflows/decision` path Incident Workspace's own approval section uses). Voice input in the\nwidget transcribes through the same real Whisper + scrubber pipeline as\n[Voice Intake](/intake/voice-intake.md) \u2014 one pipeline, not two parsers. Image upload uses the same\n[Vision Intake](/intake/vision-intake.md) flow.\n\n# Provider mode selection \u2014 a known gap\n\nThe plumbing for the 3 [demo modes](/demo-modes/) exists on the frontend\n(`frontend/src/lib/providerMode.js` persists the choice, `frontend/src/lib/api.js` attaches it to\nevery request as headers, `frontend/src/lib/providers.js` mirrors the backend's capability flags),\nbut as of this bundle's writing there is no login-time mode-selector component wired up in\n`frontend/src/components/` \u2014 the default mode (`free_demo`, Gemini) is what every visitor gets\nuntil that UI is built.\n\n# Accessibility\n\nMandatory, not optional: every voice action has keyboard parity, focus states are visible, and a\nconfirmation step before any voice-initiated side-effecting action is required \u2014 claiming\naccessibility while shipping mouse-only interaction would be worse than not claiming it at\nall.[^rules-frontend]\n\n[^rules-frontend]: Frontend Rules & Commenting Standard\n[^decisions-log]: Decisions Log"}, {"id": "architecture/model-routing", "type": "Reference", "title": "Model Routing \u2014 LLM vs SLM vs Classical ML vs Deterministic", "description": "The routing principle (route by task shape, not model prestige) and exactly which technique each pipeline step uses.", "tags": ["llm", "architecture", "routing"], "group": "architecture", "sz": 38, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "Architecture As-Built", "resource": ".knowledge/architecture-as-built.md", "cid": "architecture/.knowledge/architecture-as-built", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-08"}, {"title": "Backend Rules & Commenting Standard", "resource": ".knowledge/rules-backend.md", "cid": "architecture/.knowledge/rules-backend", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# The routing rule\n\nBefore writing any function that calls a model, ask: is this task deterministic? If yes\n(correlation, policy checks, blast radius, voice-intent parsing, metric math, scheduling\nconstraints), it must be plain Python / scikit-learn \u2014 never an LLM call. Using an LLM for\narithmetic or rule evaluation is treated as a hard code-review failure here, not a style\npreference.[^rules-backend]\n\n# Technique per pipeline step\n\n| Step | Technique |\n|---|---|\n| Correlate | Classical ML \u2014 scikit-learn DBSCAN over alert timestamps within CMDB-topology + category buckets |\n| Enrich | Deterministic MCP tool calls + one real RAG/vector lookup (Chroma `ticket_history`) |\n| Diagnose | LLM, `reasoning`-role model, over the one real A2A handoff |\n| Plan | RAG (Chroma `runbooks`, scoped by class) + LLM `structured`-role model, then deterministic guardrails (blast radius, policy gate, and for patch workflows, scheduling) |\n| Policy Gate | Deterministic rule engine (pure Python, no LLM, no ML) |\n| Execute | Deterministic \u2014 audit-log write only, no real script execution against live infrastructure |\n| Verify | Deterministic \u2014 the Fake Fix Detector, two independent signals required |\n| Sync | Deterministic \u2014 writes back to ITSM + proposes a CMDB update |\n| Knowledge | Deterministic \u2014 seeds the Negative KB on a suppressed-symptom outcome |\n| Voice/image intake scrub | Local SLM (Ollama) + regex, never a hosted model |\n| Voice intent parsing | Deterministic closed-vocabulary matcher \u2014 never an LLM, see [Voice Intake](/intake/voice-intake.md) |\n| Any LLM call, if the active provider fails | Local Ollama SLM offline fallback |\n| Chat assistant intent classification | LLM (`default`-role model); everything the classifier's intent triggers (ticket queries, approve/reject) is a real deterministic action, not model-generated |\n\nThis table describes technique per step, not which literal model id fills an LLM/SLM role for a\ngiven provider \u2014 that mapping lives in [Provider Registry](provider-registry.md) (current,\nmulti-provider) since the original hackathon-era model-per-task table (`.knowledge/models-routing.md`)\nwas written against the single TCS endpoint and has not been kept in sync with the provider\nrefactor.[^architecture-as-built]\n\n# Rehearsed trade-offs\n\n- The reasoning-role call (Diagnosis) costs latency \u2014 tens of seconds on a busy provider; it runs\n  on one step only, asynchronously.\n- Higher agent turn counts are not reliably better (an external benchmarking finding cited in the\n  PRD) \u2014 hence hard turn caps per agent, see [Supervisor](/agents/supervisor.md).\n- Voice/vision latency is confined to intake, never the main agent loop.\n- Local SLMs are weaker \u2014 used only for narrow tasks (redaction, classification), never for\n  reasoning steps.\n\n[^architecture-as-built]: Architecture As-Built\n[^rules-backend]: Backend Rules & Commenting Standard"}, {"id": "architecture/overview-metrics", "type": "Reference", "title": "Overview Dashboard Metrics", "description": "Exactly how every number on the Overview tab is computed and from what real data, so no metric is a canned or estimated figure.", "tags": ["metrics", "dashboard", "trust"], "group": "architecture", "sz": 39, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-08T00:00:00Z"}, "verified": [], "sources": [{"title": "Architecture As-Built", "resource": ".knowledge/architecture-as-built.md", "cid": "architecture/.knowledge/architecture-as-built", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-08"}], "body": "# Overview\n\n`Overview.jsx` fetches 4 endpoints on load \u2014 `GET /metrics/summary`, `GET /cmdb/drift`,\n`GET /autonomy-ladder`, `GET /audit-log?limit=6` \u2014 and every number is computed **live, on every\npage load**, from real SQLite rows (`audit_log`, `negative_kb_entries`, `cmdb_ci*`,\n`autonomy_ladder`) and the real `data/alerts.json` dataset. Nothing on this tab is a canned\nnumber.[^architecture-as-built]\n\n# CMDB drift, explained\n\nTwo generated-identical, then deliberately-diverged datasets: `cmdb_ci` (the \"recorded\" CMDB\nstate) and `cmdb_ci_ground_truth` (the \"actual\" state \u2014 35% of the 200 CIs each have exactly one\nfield changed at generation time). `GET /cmdb/drift` field-by-field-compares 6 fields per CI;\n`drift_rate = drifted_count / total_cis`. This never changes during a live session \u2014 the Sync agent\ndeliberately never mutates the recorded CI record (only logs a pending proposal), so it's a static\nsnapshot of CMDB messiness, not a live metric.[^architecture-as-built]\n\n# Top KPI row\n\n| Tile | Computation |\n|---|---|\n| Workflow runs this session | `COUNT(audit_log)` where `action='correlate'` |\n| Completed | `COUNT(audit_log)` where `action='execute_plan'` \u2014 reached execution; does **not** mean verified-fixed, a `symptom_suppressed` outcome still counts here |\n| Human approvals | `COUNT(audit_log)` where `action='human_approve_plan'` |\n| CMDB drift rate | `drifted_count / total_cis`, from the CMDB-drift diff above |\n| Stopped before completion | `total_workflow_runs_this_session - completed_runs` |\n| Negative-KB entries seeded | `COUNT(*)` on `negative_kb_entries` (seed data + any runtime entries) |\n| Manual steps avoided | Sum of `len(evidence_ids)` across every `execute_plan` audit row \u2014 a real count of the runbook-step-chunk IDs that plan actually cited, not an estimate |\n\n# Chart rows\n\n| Card | Computation |\n|---|---|\n| Human decisions (bar) | approvals vs `COUNT(audit_log)` where `action='human_reject_plan'` |\n| Manual triage avoided (\"alerts collapsed\") | `1 - n_clusters/len(alerts)` \u2014 runs the real DBSCAN correlation engine over every alert in the full synthetic dataset |\n| CMDB accuracy (donut) | same drift diff, shown as counts (accurate vs drifted) instead of a rate |\n| Incident resolution time (stat pair) | per-incident real wall-clock: average `(first draft_plan timestamp - first correlate timestamp)` and `(first verify_resolution timestamp - first correlate timestamp)`, across incidents that reached each stage |\n| Human satisfaction (proxy, gauge) | `human_approvals / (human_approvals + human_rejections)`; shown as \"no decisions yet\" rather than a misleading 0% when both are zero |\n| Toil removed | identical number to \"Manual steps avoided\" above, shown as a standalone figure |\n| Recent activity | last 6 `audit_log` rows, newest first; role-gated to approver/admin |\n| Most-trusted runbooks | top 5 by `verified_resolution_count`, joined from `autonomy_ladder` + `runbooks` \u2014 seeded to one starting-tier row per runbook; `verified_resolution_count`/`current_tier` have no runtime writer, so this reflects static seed state, not live promotion during a session |\n\n[^architecture-as-built]: Architecture As-Built"}, {"id": "architecture/provider-propagation", "type": "Module", "title": "Provider Propagation", "description": "How a visitor's chosen LLM provider/mode (Instant Demo / Bring Your Own Key / Free Demo Key) reaches every LLM call site without threading a parameter through the whole Supervisor -> specialist chain.", "tags": ["llm", "architecture", "request-scoped"], "group": "architecture", "sz": 38, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/provider_context.py", "resource": "backend/provider_context.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}, {"title": "backend/api_client.py", "resource": "backend/api_client.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}], "body": "# Overview\n\nA visitor's testing mode is picked once, on the frontend, and persisted in `localStorage` (see\n`frontend/src/lib/providerMode.js`). Every request goes through `apiFetch()`\n(`frontend/src/lib/api.js`), which attaches it as plain HTTP headers: `X-LLM-Provider` (a provider\nid, or the literal string `instant_demo`) and, for Bring Your Own Key, `X-LLM-Api-Key`.[^provider-context-py]\n\nOn the backend, the FastAPI dependency `get_provider_context()` reads those headers once per\nrequest and sets two `contextvars` (`_active_provider`, `_active_api_key`) for that request's\nduration. Anything downstream \u2014 `api_client.py`, `intake/voice_path.py`, `intake/vision_path.py` \u2014\nreads the same contextvar via `get_active_provider()`/`get_active_api_key()`, instead of the\nSupervisor threading an explicit parameter through every agent's frozen, tested signature.[^provider-context-py]\nNo header sent (local dev, `smoke_test.py`, pytest) falls back to `providers.DEFAULT_PROVIDER`, so\nnone of those call sites had to change behavior for this refactor.\n\n# Instant Demo short-circuit\n\nIf `X-LLM-Provider: instant_demo`, `get_provider_context()` returns\n`ProviderContext(provider=INSTANT_DEMO, is_instant_demo=True)` without ever touching the LLM\ncontextvars meaningfully \u2014 callers check `provider_ctx.is_instant_demo` and branch to reading\npregenerated output instead of making any live call (see\n[Instant Demo](/demo-modes/public-hosting-modes.md) and `main.py`'s `/workflows/run`, `/chat`).\n\n# `api_client.py` \u2014 the client factory that reads this context\n\n`get_llm(role, temperature, enable_offline_fallback)` builds a `ChatOpenAI` bound to whichever\nprovider is active on the current request, selecting the model via `provider_cfg[\"roles\"][role]`\n(see [Provider Registry](provider-registry.md)) rather than a literal model id \u2014 so the same call\nsite works unchanged across every provider. It wraps the primary client with LangChain's\n`.with_fallbacks([...])` to a local Ollama model, independent of which provider is primary \u2014 this\nresilience layer (originally built against the single TCS endpoint) still applies per-provider\nafter the multi-provider refactor.[^api-client-py]\n\n`get_embeddings()` deliberately does **not** read this per-request context \u2014 see\n[Embeddings Fixed Provider](/decisions/embeddings-fixed-provider.md).\n\n# Security note\n\nThe BYOK key only ever lives in the `_active_api_key` contextvar for the lifetime of one request \u2014\nnever written to `audit_log`, never logged, never persisted.[^provider-context-py]\n\n# Consumers\n\n[Diagnosis Agent](/agents/diagnosis-agent.md), [Planner Agent](/agents/planner-agent.md) (both call\n`get_llm()` with a role), [Voice Intake](/intake/voice-intake.md), [Vision Intake](/intake/vision-intake.md),\nand the chat assistant's intent classifier (`main.py`'s `POST /chat`).\n\n[^provider-context-py]: backend/provider_context.py\n[^api-client-py]: backend/api_client.py"}, {"id": "architecture/provider-registry", "type": "Module", "title": "LLM Provider Registry", "description": "backend/providers.py \u2014 the multi-provider LLM registry (Gemini default, OpenRouter fallback, TCS legacy/gated) with a per-role model map, replacing the original single-hardcoded-endpoint design.", "tags": ["llm", "config", "providers"], "group": "architecture", "sz": 41, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/providers.py", "resource": "backend/providers.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}], "body": "# Overview\n\n`PROVIDERS: dict[str, dict]` holds one entry per LLM provider OpsFlow can talk to. Unlike a\nsingle-`default_model`-per-provider design, each entry carries a `roles` map \u2014 `default`,\n`reasoning`, `structured`, `vision` \u2014 because OpsFlow's agent chain calls distinct models for\ndistinct capability needs (see [Model Routing](model-routing.md)), not one general-purpose model\neverywhere.[^providers-py]\n\n# Schema\n\n| Provider id | Label | Base URL | Vision | Transcription | SSL bypass |\n|---|---|---|---|---|---|\n| `gemini` | Google Gemini | `generativelanguage.googleapis.com/v1beta/openai/` | yes | no | no |\n| `openrouter` | OpenRouter | `openrouter.ai/api/v1` | yes | no | no |\n| `tcs` | TCS GenAI Lab (legacy, internal network only) | `config.BASE_URL` | yes | yes (Whisper) | yes |\n\nEach entry also carries: `embedding_model` (or `None` \u2014 OpenRouter has no embeddings endpoint, and\nembeddings never actually read this per-provider value at request time regardless, see\n[Embeddings Fixed Provider](/decisions/embeddings-fixed-provider.md)), `key_hint` (shown in a\nBring Your Own Key UI), and for `tcs` a `note` warning it's gated and unreachable from the public\ndeploy.\n\n# Roles\n\n- `default` \u2014 general/summarization/self-check.\n- `reasoning` \u2014 root-cause hypothesis generation (Diagnosis); needs genuine multi-step reasoning,\n  tolerates higher latency.\n- `structured` \u2014 remediation-plan drafting / chat filter-extraction; must return valid JSON\n  reliably at a normal token budget (reasoning-heavy free models can burn the budget on hidden\n  thinking tokens and truncate structured output \u2014 this shaped the actual model picks per role).\n- `vision` \u2014 screenshot/error-image extraction.\n\n`gemini`'s roles (`gemini-flash-lite-latest` for default/structured, `gemini-flash-latest` for\nreasoning/vision) are Google's forward-compatible `-latest` aliases. `openrouter`'s roles are\n`:free`-suffixed model ids \u2014 flagged in the code as an unverified placeholder registry (no live\n`OPENROUTER_API_KEY` had been smoke-tested against these ids as of this bundle's writing) rather\nthan empirically confirmed the way the TCS substitutions were (see\n[Model Routing](model-routing.md)).\n\n# Fixed module-level constants\n\n- `DEMO_PROVIDER = \"gemini\"` \u2014 backs Free Demo Key mode (see [Demo Modes](/demo-modes/)); its key\n  comes from `config.GEMINI_API_KEY`, a platform secret, never committed.\n- `EMBEDDING_PROVIDER = DEMO_PROVIDER` \u2014 the provider used to embed/query Chroma, **regardless** of\n  which provider a visitor's own session is on. See\n  [Embeddings Fixed Provider](/decisions/embeddings-fixed-provider.md) for why.\n- `DEFAULT_PROVIDER` \u2014 `os.getenv(\"DEFAULT_PROVIDER\", DEMO_PROVIDER)`, used whenever a request\n  doesn't specify a provider (local dev, tests, scripts).\n\n# Functions\n\n- `resolve_provider(name) -> str` \u2014 validates a provider name from a request header, falling back\n  to `DEFAULT_PROVIDER` for anything missing or unrecognized.\n- `api_key_for(provider, byok_key) -> str` \u2014 a visitor-supplied Bring Your Own Key wins if present;\n  otherwise resolves the platform-configured key for that provider (`GEMINI_API_KEY`,\n  `OPENROUTER_API_KEY`, or `config.API_KEY` for `tcs`).\n\n# Consumers\n\n[Provider Propagation](provider-propagation.md) (the per-request active-provider mechanism and\n`api_client.py`'s `get_llm()`/`get_embeddings()`), the voice and vision intake paths (see\n[Intake](/intake/)), and `scripts/pregenerate_demo_outputs.py` (see\n[Pregenerate Script](/demo-modes/pregenerate-script.md)).\n\n[^providers-py]: backend/providers.py"}, {"id": "architecture/tier-architecture", "type": "System", "title": "Tier Architecture", "description": "The layered system diagram (presentation, intake, AI solution, knowledge/transactional storage, tool/integration, simulated systems), the routing principle, and the two-level orchestration shape.", "tags": ["architecture", "overview"], "group": "architecture", "sz": 39, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "Architecture Overview", "resource": ".knowledge/arch-overview.md", "cid": "architecture/.knowledge/arch-overview", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# Overview\n\nOpsFlow's design intent (frozen in `PRD_FINAL.md`) is six layers, top to bottom:[^arch-overview]\n\n```\nPRESENTATION        Next.js cockpit (see cockpit-ui.md)\nINTAKE LAYER         Alert HTTP | Voice (Whisper) | Image (Vision)\n                      -> one canonical MaintenanceSignal, scrubbed before anything downstream sees it\nAI SOLUTION LAYER    Supervisor --A2A--> one specialist (Diagnosis); everything else in-process, typed\n                      Guardrails . Policy gate . Model router\nKNOWLEDGE/STATE      Chroma (runbooks, postmortems, ticket history, negative KB)\n                      SQLite (incidents, approvals, audit log, workflow state, autonomy ladder)\nTOOL/INTEGRATION     MCP servers, one per simulated system (Monitoring / ITSM / Tracker / CMDB / Patch)\nSIMULATED SYSTEMS    Our own FastAPI mocks \u2014 explicitly NOT third-party SaaS, labelled as such in the UI\n```\n\nThe frontend is Next.js per this frozen design (migrated from an earlier Vite/React scaffold \u2014 see\n[Decisions](/decisions/) for context); the backend (Phases 0-3 of the original build) is\nstack-agnostic FastAPI, async throughout.\n\n# Routing principle\n\nRoute by task shape, not model prestige: deterministic tasks (correlation, policy checks, blast\nradius, voice-intent parsing, metric math) get **no LLM at all**; sensitive free text goes to a\nlocal Ollama SLM; only genuine multi-step reasoning over conflicting evidence gets a reasoning\nmodel. Full technique-per-step table: [Model Routing](model-routing.md).\n\n# Orchestration shape\n\n**Two levels only: one Supervisor + specialist agents** \u2014 deliberately not a deep hierarchy or a\nfree agent mesh. Specialists never call each other directly; each returns a typed result the\nSupervisor re-validates against a schema before dispatching the next one. Every agent has an\nexplicit termination condition and a hard turn cap. Rationale: MAST failure-taxonomy analysis\nattributes 44.2% of multi-agent failures to system design and 32.3% to inter-agent misalignment \u2014 a\ncentralized validation bottleneck contains error amplification to roughly 4.4x vs roughly 17x for\nan uncoordinated system.[^arch-overview] Full chain: [Agents](/agents/).\n\n# Protocol layer\n\n| Layer | Protocol | What's built |\n|---|---|---|\n| Agent -> systems | MCP | 5 local MCP servers (Monitoring, ITSM, Tracker, CMDB, Patch Source) exposing typed tools \u2014 see [Tools](/tools/) |\n| Agent -> agent | A2A | **One** real, signed Supervisor \u003c-> Diagnosis handoff \u2014 see [A2A Handoff](/agents/a2a-handoff.md) |\n\nBoth protocols run locally and call nothing outbound.\n\n# Memory strategy\n\n- **Working memory** \u2014 current workflow state in SQLite, passed as a compact typed object between\n  agents, never the full conversation transcript.\n- **Episodic memory** \u2014 closed incidents/postmortems embedded into Chroma.\n- **Negative memory** \u2014 rejected plans and failed remediations, embedded separately, consulted at\n  planning time (never a blanket filter \u2014 see [Bias Mitigation](/guardrails/bias-mitigation.md)).\n- **Semantic memory** \u2014 runbooks + CMDB schema, chunked structurally (see\n  [Chunking](/guardrails/chunking.md)).\n\n[^arch-overview]: Architecture Overview"}, {"id": "data/database-schema", "type": "Schema", "title": "Database Schema \u2014 SQLite + Chroma", "description": "Transactional/workflow state lives in SQLite; runbook/postmortem/ticket-history/negative-KB content lives embedded in Chroma. An append-only audit_log is enforced at the DB layer, not just by application discipline.", "tags": ["schema", "database", "sqlite", "chroma"], "group": "data", "sz": 43, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/db/schema.sql", "resource": "backend/db/schema.sql", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-08"}, {"title": "Database Schema (SQLite + Chroma)", "resource": ".knowledge/schema-db.md", "cid": "data/.knowledge/schema-db", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# SQLite \u2014 transactional/state\n\n| Table | Purpose |\n|---|---|\n| `cmdb_ci` / `cmdb_ci_ground_truth` | as-recorded vs. actual CI state \u2014 the pair the Drift Queue diffs, see [Overview Metrics](/architecture/overview-metrics.md) |\n| `cmdb_relationship` | adjacency edges [Blast Radius](/guardrails/blast-radius.md) BFS-walks |\n| `alerts` | ingested alerts, normalized (`ci_id`/`category`/`severity`/`summary`) |\n| `incidents`, `evidence`, `hypotheses`, `plans`, `approvals`, `verification_results` | per-incident structured record shapes \u2014 as of this bundle's writing these have no runtime writer; the agent chain's real state instead flows through `audit_log` and the JSON `trace_snapshot` on `local_tickets` |\n| `audit_log` | append-only actor/action/target/evidence/model/approval/modality log \u2014 see below |\n| `autonomy_ladder` | one row per runbook, seeded at `suggest_only`/0 \u2014 no runtime promotion writer exists yet, a display of intended structure, not a live promotion engine |\n| `negative_kb_entries` | written by [Knowledge Agent](/agents/knowledge-agent.md) on a `symptom_suppressed` outcome |\n| `runbooks` | id/class/content_ref pointing at the chunked Chroma document |\n| `scenarios` | the Scenario Library, doubling as the test-fixture set |\n| `model_call_cache` | `hash(prompt_version, scrubbed_input) -> response` |\n| `pii_ground_truth` | planted sensitive items for the [Scrubber](/guardrails/scrubber.md)'s measured precision/recall |\n| `patch_inventory`, `change_calendar` | simulated vendor patch feed + blackout windows, read by `guardrails/scheduling.py` |\n| `users` | real accounts \u2014 PBKDF2-HMAC-SHA256 salted password hashes, one fixed role per account (`ops_engineer`\\|`approver`\\|`admin`) \u2014 see [Real Authentication](/decisions/real-authentication.md) |\n| `local_tickets` | additive local mirror of the (simulated) ITSM/Tracker ticket per workflow run, including a full `trace_snapshot` JSON so a past run can be reopened without re-running the agent chain (there is no checkpointing \u2014 see [No Workflow Checkpointing](/decisions/no-workflow-checkpointing.md)) |\n| `integration_settings` | single row, holds where a future real ServiceNow/Jira instance would be pointed at \u2014 never functional in this build |\n\n[^schema-sql]\n\n# `audit_log` \u2014 enforced append-only\n\n```sql\nCREATE TRIGGER audit_log_no_update BEFORE UPDATE ON audit_log\nBEGIN SELECT RAISE(ABORT, 'audit_log is append-only: UPDATE is not permitted'); END;\n```\n\nA real SQLite trigger rejects any `UPDATE`/`DELETE` at the database layer \u2014 a raw SQL statement\nagainst this table is rejected by the DB itself, not merely a convention the application layer is\ntrusted to honor.[^schema-sql] Every workflow step, every human decision, every intake action writes\none row here \u2014 actor, action, target artifact, timestamp, evidence IDs, model used, approval\nreference, input modality.\n\n# Chroma \u2014 vector/RAG\n\n| Collection | Content |\n|---|---|\n| `runbooks` | chunked per [Chunking](/guardrails/chunking.md)'s structural rules; metadata includes a heading path and `class` |\n| `postmortems` | narrative RCA docs, plus Knowledge Base articles tagged `doc_type` in the same chunking function |\n| `ticket_history` | closed incidents/changes/tuning tasks, embedded for [Enrichment](/agents/enrichment-agent.md)'s precedent lookup |\n| `negative_kb` | embedded separately from positive knowledge, scoped by `(ci_class, failure_signature)`, never a blanket filter |\n\nAll four are embedded and queried via a single **fixed** provider \u2014 see\n[Embeddings Fixed Provider](/decisions/embeddings-fixed-provider.md) \u2014 regardless of which LLM\nprovider a given visitor session is using.\n\n# Why SQLite + Chroma, not Postgres/Neo4j\n\nModerate data volume (hundreds of records); CI relationships are covered adequately by a plain\nadjacency table, so a graph database was judged unnecessary overkill for this scale.[^schema-db]\n\n[^schema-sql]: backend/db/schema.sql\n[^schema-db]: Database Schema (SQLite + Chroma)"}, {"id": "decisions/embeddings-fixed-provider", "type": "Decision", "title": "Embeddings Stay Pinned to One Fixed Provider", "description": "Unlike chat/vision calls, embeddings never follow a visitor's per-session provider choice \u2014 they always use providers.EMBEDDING_PROVIDER, because every existing Chroma collection is indexed at one specific embedding model's vector dimension.", "tags": ["architecture", "llm", "embeddings", "chroma"], "group": "decisions", "sz": 34, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/orchestrator/retrieval.py", "resource": "backend/orchestrator/retrieval.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}, {"title": "backend/api_client.py", "resource": "backend/api_client.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}], "body": "# Decision\n\n`orchestrator/retrieval.py`'s `_embed()` \u2014 the function [Enrichment](/agents/enrichment-agent.md)\nand [Planner](/agents/planner-agent.md) actually call for RAG \u2014 always uses\n`providers.EMBEDDING_PROVIDER` (pinned to `gemini`), regardless of the requesting visitor's chosen\nprovider/mode. `api_client.py`'s `get_embeddings()` follows the same pin and deliberately has no\nper-request contextvar read, unlike `get_llm()`.[^retrieval-py]\n\n# Alternatives considered\n\nLet embeddings follow the same per-request provider a visitor's chat calls use, for consistency\nwith `get_llm()`'s behavior.\n\n# Rationale\n\nEvery Chroma collection (`runbooks`, `postmortems`, `ticket_history`, `negative_kb`) is already\nindexed with vectors from one specific embedding model, at that model's fixed dimension. A\nquery-time switch to a different provider's embedding model \u2014 even one available in the\n[Provider Registry](/architecture/provider-registry.md) \u2014 would query with a different-dimension\nvector against an already-indexed collection and raise Chroma's `InvalidDimensionException` on\nevery single query, confirmed by direct testing. That is a hard failure, not a graceful\ndegradation, so embeddings are deliberately treated as a fixed, server-controlled system operation\non a shared index rather than a per-visitor choice.[^retrieval-py] The same reasoning is why\n`get_llm()`'s local-Ollama offline fallback (`.with_fallbacks()`) exists for chat calls but was\ndeliberately **not** wired into the live embeddings/retrieval path \u2014 Ollama's fallback embedding\nmodel produces a different-dimension vector too.[^api-client-py]\n\n# Consequence\n\nA real cross-provider embeddings fallback would require a fully separate, Ollama-indexed\ncollection, not a same-collection swap \u2014 out of scope. `get_embeddings()`'s own\n`enable_offline_fallback` parameter exists and is hand-rolled (`OpenAIEmbeddings` isn't a LangChain\n`Runnable`, so it can't use `.with_fallbacks()` directly), but it is never actually invoked from the\nlive retrieval path for exactly this reason.\n\n[^retrieval-py]: backend/orchestrator/retrieval.py\n[^api-client-py]: backend/api_client.py"}, {"id": "decisions/multi-provider-architecture", "type": "Decision", "title": "Multi-Provider Architecture for Public Hosting", "description": "Replaced the single hardcoded TCS GenAI Lab endpoint with a provider registry (Gemini default, OpenRouter fallback, TCS kept as a gated legacy option) so OpsFlow can run as a public, self-serve demo instead of only on the TCS corporate network.", "tags": ["architecture", "llm", "hosting"], "group": "decisions", "sz": 34, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/providers.py", "resource": "backend/providers.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}, {"title": "Model Routing Table", "resource": ".knowledge/models-routing.md", "cid": "decisions/.knowledge/models-routing", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# Decision\n\nIntroduced [Provider Registry](/architecture/provider-registry.md) \u2014 Gemini as the default/free\nprovider, OpenRouter as a fallback, and the original TCS GenAI Lab endpoint retained as a legacy,\ngated option \u2014 plus [Provider Propagation](/architecture/provider-propagation.md), the per-request\nmechanism that lets a visitor's choice reach every LLM call site via HTTP headers and a contextvar,\ninstead of a compile-time constant.\n\n# Alternatives considered\n\nKeep the app reachable only via the original single-endpoint design and note the public-hosting\nlimitation in the README instead of building provider abstraction.\n\n# Rationale\n\nThe original design hardcoded `genailab.tcs.in` \u2014 reachable only from the TCS corporate network,\nusing a TCS-issued key \u2014 as the sole provider for every LLM call. That is workable for an on-site\nhackathon demo but breaks entirely for a public, self-serve deploy: there is no reachable backend\nand no key a visitor outside that network could use. Gemini was chosen as the default because its\nfree tier covers both chat and vision with a single key and is OpenAI-compatible, so the existing\n`ChatOpenAI`-based plumbing needed parameterizing rather than a rewrite. TCS was kept, not deleted,\nso the app can still run against the original endpoint on that network \u2014 it just isn't the default,\nand its endpoint-specific workaround (`needs_ssl_bypass`) is now conditional per-provider rather\nthan a global, always-on monkeypatch (see `backend/config.py`'s `TCS_NETWORK` gate).\n\n# Consequence\n\nEvery call site that used to read a fixed model constant now resolves its model from\n`provider_cfg[\"roles\"][role]` (see [Provider Registry](/architecture/provider-registry.md)) \u2014 there\nis no more single \"the\" model per task the way `.knowledge/models-routing.md` originally described;\nthat document's task-to-model-id table describes the pre-refactor state and should be read\nskeptically against the current code (see [Model Routing](/architecture/model-routing.md) for the\nrouting *principle*, which still holds).[^models-routing]\n\n[^models-routing]: Model Routing Table"}, {"id": "decisions/no-workflow-checkpointing", "type": "Decision", "title": "No Workflow Checkpointing \u2014 Approval Re-Runs Fresh", "description": "run_workflow has no persisted intermediate state. Approving a paused plan in the Approval Queue re-runs the same CI fresh with auto_approve=true, rather than resuming the exact paused run \u2014 labeled honestly in the UI as a new run, not a true resume.", "tags": ["architecture", "workflow", "honesty"], "group": "decisions", "sz": 32, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "Decisions Log", "resource": ".knowledge/decisions-log.md", "cid": "decisions/.knowledge/decisions-log", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}, {"title": "backend/orchestrator/supervisor.py", "resource": "backend/orchestrator/supervisor.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-08"}], "body": "# Decision\n\n[Supervisor](/agents/supervisor.md)'s `run_workflow` is a single straight-through async call with no\npersisted intermediate state. `POST /workflows/decision` records the human approve/reject decision\nto the audit log but does **not** resume the paused run \u2014 approving in the UI triggers a completely\nnew `POST /workflows/run` for the same CI with `auto_approve=true`, producing a new `incident_id`.[^decisions-log]\n\n# Alternatives considered\n\nBuild real checkpointing \u2014 persist evidence/diagnosis/plan and resume from the exact pause point\n(more faithful to a true \"pending approval, then continue\" model, but a substantial\n`orchestrator/supervisor.py` refactor). Or, at the other extreme, record the approve/reject decision\nonly, without triggering any execution at all.[^decisions-log]\n\n# Rationale\n\nChosen as the simplest option that still lets an approved plan actually execute end-to-end, given\nthe scope/time tradeoff of building real workflow-resume machinery. Because a fresh run means a\nfresh Diagnosis call, the re-run's plan can in principle differ from what was originally approved \u2014\nthis is a real, acknowledged limitation, not a cosmetic one.[^decisions-log]\n\n# Consequence\n\n`main.py`'s `_persist_ticket_snapshot()` has to specifically detect and update an existing\n`needs_approval`-status `local_tickets` row (matched on `cmdb_ci`) rather than blindly inserting a\nnew one on every re-run \u2014 otherwise an approval would orphan the original pending ticket\npermanently at `needs_approval` while a second, unrelated-looking row captured the real outcome.\nThe UI is expected to label this honestly as \"a new run,\" never presented as a true resume of the\noriginal one.\n\n[^decisions-log]: Decisions Log\n[^supervisor-py]: backend/orchestrator/supervisor.py"}, {"id": "decisions/one-a2a-handoff", "type": "Decision", "title": "One A2A Handoff, Not All Agent Traffic", "description": "Only Supervisor -> Diagnosis travels over the real A2A protocol; every other specialist call stays in-process with typed Python contracts.", "tags": ["architecture", "a2a", "protocol"], "group": "decisions", "sz": 29, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "Decisions Log", "resource": ".knowledge/decisions-log.md", "cid": "decisions/.knowledge/decisions-log", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# Decision\n\nExactly one Supervisor \u003c-> specialist handoff (Diagnosis) travels over\n[A2A](/agents/a2a-handoff.md), chosen as the most demo-prominent reasoning step. Every other\nspecialist (Enrichment, Planner, Verification, Sync, Knowledge) is called in-process with the\ntyped `SpecialistResult` contract.\n\n# Alternatives considered\n\nRouting all agent traffic over A2A, to make a stronger protocol-adoption claim.[^decisions-log]\n\n# Rationale\n\nThe architectural claim being proven only needs one genuinely demonstrated handoff \u2014 a real,\nverifiable signed Agent Card, real discovery, real invocation. Extending A2A to every specialist\ncall would be real implementation burden (a second Agent Card, a second endpoint, more surface for\ntransport failures) for no marginal credit toward that claim.[^decisions-log] Documented explicitly\nas a scoped choice: if time runs out, the fallback plan was \"cut the A2A implementation, keep the\nargument\" \u2014 i.e. it is acceptable to say the team designed for A2A and did not implement it, but\nnever acceptable to imply more was built than actually was.\n\n[^decisions-log]: Decisions Log"}, {"id": "decisions/real-authentication", "type": "Decision", "title": "Real Authentication, Superseding \"No Real Auth\"", "description": "Reverses an earlier PRD call (\"mock JWT + free role-switcher, zero marginal credit for real auth\") \u2014 implements a real users table with salted PBKDF2 password hashes, POST /auth/login that actually rejects bad credentials, and one fixed role per account, plus a scoped admin-only \"View as\" impersonation control.", "tags": ["architecture", "auth", "security"], "group": "decisions", "sz": 33, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "Decisions Log", "resource": ".knowledge/decisions-log.md", "cid": "decisions/.knowledge/decisions-log", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}, {"title": "backend/db/schema.sql", "resource": "backend/db/schema.sql", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-08"}], "body": "# Decision\n\nSupersedes the original PRD position that real authentication had \"zero marginal credit, real cost\"\nand that a simulated-identity, self-service role picker was sufficient. Implements a real `users`\ntable (replacing an earlier `profiles` table) with per-account salted PBKDF2-HMAC-SHA256 password\nhashes (stdlib `hashlib`, no new dependency), a `POST /auth/login` that actually validates\nusername+password and returns 401 on bad credentials, and one fixed role per account \u2014 no more\nself-service role-picking at login or in the sidebar. Admin retains a scoped, audited \"View as\"\nimpersonation control for demo/testing, rather than the earlier free-for-all profile switcher any\nlogged-in user could use to grant themselves elevated access.[^decisions-log]\n\n# Alternatives considered\n\nKeep the original mock/simulated-identity design and only fix the login page's explanatory copy. A\nfull third-party auth provider (OAuth/SSO) \u2014 rejected as disproportionate scope for a prototype with\nno real user base.[^decisions-log]\n\n# Rationale\n\nThe mock-login-plus-free-role-switcher combination read as confusing on review and, on reflection,\ninsecure: any authenticated session could self-elevate to Admin. PBKDF2 via the Python standard\nlibrary was chosen over `bcrypt`/`passlib` specifically to avoid a new pip dependency in an\nenvironment where package installs had repeatedly hit corporate-proxy SSL friction.[^decisions-log]\n\n# Consequence\n\n`ROLE_TO_ACTOR_ROLE` in `main.py` maps the UI-facing role vocabulary\n(`ops_engineer`/`approver`/`admin`) to [Policy Gate](/guardrails/policy-gate.md)'s separate,\nfrozen `actor_role` vocabulary (`operator`/`sre_lead`/`change_manager`) \u2014 a real fix, since the\nsystem previously passed the raw logged-in username as `actor_role`, meaning the policy gate's\napprover check could never match any real login and every prod/P1 action silently required\napproval regardless of who was actually logged in.\n\n[^decisions-log]: Decisions Log"}, {"id": "decisions/two-level-supervisor", "type": "Decision", "title": "Two-Level Supervisor + Specialists", "description": "Chose a flat Supervisor-plus-specialists topology (agents never call each other directly, every result re-validated against a schema) over a deeper hierarchy, a free agent mesh, a single do-everything agent, or an off-the-shelf framework like LangGraph/CrewAI/AutoGen.", "tags": ["architecture", "agents", "orchestration"], "group": "decisions", "sz": 30, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "Decisions Log", "resource": ".knowledge/decisions-log.md", "cid": "decisions/.knowledge/decisions-log", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# Decision\n\n**Two-level Supervisor + specialists**, with the Supervisor re-validating every specialist's typed\nresult against a schema before dispatching the next agent, and specialists never calling each other\ndirectly. See [Supervisor](/agents/supervisor.md) and [Agents](/agents/) for the implementation.\n\n# Alternatives considered\n\nA single do-everything agent; fully autonomous remediation with no gate; LLM-based alert\ncorrelation; an off-the-shelf multi-agent framework (LangGraph/CrewAI/AutoGen); routing all traffic\nover A2A instead of typed in-process contracts; an MCP server that itself \"coordinates agents.\"[^decisions-log]\n\n# Rationale\n\nAn external multi-agent failure taxonomy (MAST) attributes 44.2% of multi-agent failures to system\ndesign and 32.3% to inter-agent misalignment. A centralized validation bottleneck \u2014 one Supervisor\nthat must approve every handoff \u2014 contains error amplification to roughly 4.4x versus roughly 17x\nfor an uncoordinated system.[^decisions-log] Framework independence and explainability were also\nweighed directly against off-the-shelf orchestration frameworks: [MCP + A2A](/agents/a2a-handoff.md)\nalready provide the interop a framework would otherwise supply, without opaque internal routing\nlogic a jury (or a maintainer) can't inspect.\n\n[^decisions-log]: Decisions Log"}, {"id": "demo-modes/pregenerate-script", "type": "Module", "title": "Pregenerate Script", "description": "Runs the real agent pipeline once, with a real Free Demo Key, against every named scenario plus one PII-scrubbing demo fixture, and writes the results to data/demo_outputs.json for Instant Demo mode to replay with zero live calls.", "tags": ["demo", "tooling"], "group": "demo-modes", "sz": 33, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "scripts/pregenerate_demo_outputs.py", "resource": "scripts/pregenerate_demo_outputs.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}], "body": "# Overview\n\nRun once, locally, with a real key: `cd backend && GEMINI_API_KEY=... python\n../scripts/pregenerate_demo_outputs.py`. It wires the same in-process MCP/A2A stack the live app\nuses (`orchestrator/mcp_wiring.py`), loads every `data/scenarios/SCEN-*.json` fixture, and for each\none runs the real `run_workflow()` \u2014 the identical Supervisor path a live visitor's click would\ntrigger \u2014 then formats and writes the result to `data/demo_outputs.json`, keyed by\n`f\"{ci_id}:{workflow_type}\"`.[^pregenerate-py]\n\n# Idempotent and crash-safe\n\nA scenario key already present in the output file is skipped, so a partial run (e.g. hitting a rate\nlimit) can simply be re-run to finish the rest. The output file is rewritten after **every** case,\nnot just at the end, so a crash mid-run doesn't lose already-generated progress.[^pregenerate-py]\n\n# Rate-limit handling\n\n`MIN_CALL_INTERVAL = 8.0` throttles calls to stay under Gemini's free-tier requests-per-minute cap;\non a 429/`RESOURCE_EXHAUSTED` response it parses the provider's own suggested `retryDelay` out of\nthe error message and retries (up to 5 attempts) rather than failing the whole run over a transient\nrate limit.[^pregenerate-py]\n\n# PII-demo fixture\n\nBeyond the named scenarios, the script also generates one `image_pii_demo` entry: a rendered error\ndialog naming a person and an email address, run through the real, unmodified\n[Vision Intake](/intake/vision-intake.md) pipeline, so the captured `MaintenanceSignal` shows a\ngenuine `[NAME_1]`/`[EMAIL_1]` redaction rather than a hand-written example. Only the image path\ngets this treatment \u2014 synthesizing realistic speech audio naming a person would need a\ntext-to-speech dependency the project doesn't otherwise use.[^pregenerate-py]\n\n[^pregenerate-py]: scripts/pregenerate_demo_outputs.py"}, {"id": "demo-modes/public-hosting-modes", "type": "System", "title": "Public Hosting Modes", "description": "Three visitor-chosen ways to run OpsFlow \u2014 Instant Demo (zero live calls), Bring Your Own Key (visitor supplies a provider + key), and Free Demo Key (a Gemini key the operator controls) \u2014 replacing a design that only worked on the TCS corporate network.", "tags": ["demo", "hosting", "llm"], "group": "demo-modes", "sz": 35, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "frontend/src/lib/providerMode.js", "resource": "frontend/src/lib/providerMode.js", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}, {"title": "backend/main.py", "resource": "backend/main.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}], "body": "# Overview\n\n`frontend/src/lib/providerMode.js` persists one of three modes in `localStorage`:\n`{mode: \"instant_demo\" | \"byok\" | \"free_demo\", provider, byokKey}`. Default is\n`{mode: \"free_demo\", provider: \"gemini\", byokKey: null}`.[^provider-mode-js] Every request attaches\nthe active mode as headers (see [Provider Propagation](/architecture/provider-propagation.md)),\nwhich the backend resolves into a `ProviderContext`.\n\n# Instant Demo \u2014 zero live calls\n\nWhen `X-LLM-Provider: instant_demo`, endpoints that would otherwise call a model instead read from\na pregenerated `data/demo_outputs.json` (built by [Pregenerate Script](pregenerate-script.md)).\n`POST /workflows/run` looks up `f\"{ci_id}:{workflow_type}\"` and 400s with an explanatory message if\nthe requested combination isn't one of the pregenerated scenarios \u2014 a visitor gets a real,\npreviously-verified result with genuinely zero live model spend, at the cost of only covering the\nhandful of named scenarios.[^main-py] `POST /chat` and the voice/image intake endpoints similarly\nshort-circuit to an explanatory message rather than attempting a live call.\n\n# Bring Your Own Key \u2014 visitor supplies provider + key\n\nThe visitor picks a provider (`gemini`/`openrouter`/`tcs`) and supplies their own API key, sent as\n`X-LLM-Api-Key`. `providers.api_key_for()` prefers this key over any platform-configured one for\nthat provider. Full live functionality \u2014 chat, diagnosis, voice (where supported), image intake \u2014\nruns against the visitor's own quota/billing.\n\n# Free Demo Key \u2014 operator-controlled shared key\n\nUses `providers.DEMO_PROVIDER` (`gemini`) with a key the OpsFlow operator controls\n(`config.GEMINI_API_KEY`, a platform secret, never committed). Full live functionality, but shared\nquota across every visitor using this mode \u2014 the same free-tier constraint that shaped\n[Pregenerate Script](pregenerate-script.md)'s throttling.\n\n# Known gap: no mode-selector UI yet\n\nThe plumbing for all three modes is complete on both backend and frontend, but as of this bundle's\nwriting there is no login-time mode-selector component in `frontend/src/components/` \u2014 see\n[Cockpit UI](/architecture/cockpit-ui.md)'s \"known gap\" note. Every visitor currently gets the\ndefault (`free_demo`, Gemini) until that UI is built.\n\n[^provider-mode-js]: frontend/src/lib/providerMode.js\n[^main-py]: backend/main.py"}, {"id": "getting-started", "type": "Guide", "title": "Getting Started with OpsFlow", "description": "What OpsFlow is, the request lifecycle for one incident, and where to read next in this bundle.", "tags": ["overview", "onboarding"], "group": "(root)", "sz": 40, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "CLAUDE.md hub index", "resource": "/CLAUDE.md", "cid": "CLAUDE", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}, {"title": "Architecture Overview", "resource": ".knowledge/arch-overview.md", "cid": ".knowledge/arch-overview", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# Overview\n\nOpsFlow is a prototype \"Cross-Stack Maintenance Control Plane\" for IT Application Maintenance: a\ncoordinated multi-agent system that turns three classes of manual IT-ops toil \u2014 incident\nresolution, patch management, performance tuning \u2014 into one auditable, guardrailed pipeline from\n\"signal received\" to \"ticket closed, CMDB updated, knowledge captured.\"[^claude-md] The prototype's\npoint is proving the *coordination*, not just wrapping a chatbot around a ticketing system.\n\n# The request lifecycle, once, end to end\n\n1. A signal arrives \u2014 a fault alert (primary path), a voice command, or a screenshot \u2014 and is\n   normalized into one canonical `MaintenanceSignal` object, then scrubbed of PII/secrets. See\n   [Intake](intake/).\n2. The Supervisor dispatches a fixed chain of specialists: Enrichment gathers evidence, Diagnosis\n   (the one step that travels over a real A2A handoff) generates cited root-cause hypotheses,\n   Planner drafts a plan from retrieved runbook chunks and computes blast radius + a policy-gate\n   decision. See [Agents](agents/) and [Guardrails](guardrails/).\n3. If the policy gate requires it, a human approves or rejects (with a mandatory reason) before\n   anything \"executes.\" See [Workflows](workflows/) for how this differs across incident/patch/\n   performance-tuning.\n4. Verification's Fake Fix Detector checks two independent signals (alert cleared **and** the\n   underlying metric held recovered) before calling anything genuinely fixed. Sync writes a\n   consistent outcome back to the simulated ITSM/CMDB systems; Knowledge seeds a Negative KB entry\n   if the fix turned out to be fake.\n5. Every step logs an immutable audit entry. The Overview dashboard renders live metrics computed\n   from that same data \u2014 see [Overview Metrics](architecture/overview-metrics.md).\n\n# Where to read next\n\n- New to the codebase? Start with [Tier Architecture](architecture/tier-architecture.md) for the\n  system diagram, then [Agents](agents/) for the chain in demo-importance order.\n- Working on the LLM layer? Read [Provider Registry](architecture/provider-registry.md) and\n  [Provider Propagation](architecture/provider-propagation.md) \u2014 this is the part of the system\n  most recently and substantially reworked (see below).\n- Curious why a decision looks the way it does (two-level agent topology, one A2A handoff, no\n  workflow checkpointing)? See [Decisions](decisions/).\n\n# A system mid-refactor \u2014 read this before trusting \"the old docs\"\n\nOpsFlow's own `.knowledge/` tree (this bundle's primary source) was written against an earlier\ndesign where every LLM call went to one hardcoded TCS GenAI Lab endpoint. That has since been\nreplaced by a genuine multi-provider architecture \u2014 see\n[Provider Registry](architecture/provider-registry.md) and\n[Multi-Provider Architecture](decisions/multi-provider-architecture.md) \u2014 so that OpsFlow can run\nas a public, self-serve demo instead of only on the TCS corporate network. Two `.knowledge/` files\nin particular (`models-routing.md`, `arch-overview.md`) still describe the old single-endpoint\nstate in places; this bundle was written from the actual code (`backend/providers.py`,\n`provider_context.py`) as the source of truth wherever the two disagree.\n\n[^claude-md]: CLAUDE.md hub index"}, {"id": "guardrails/bias-mitigation", "type": "Reference", "title": "Bias Mitigation", "description": "How each of 9 identified bias sources (retrieval, instrumentation, historical assignment, alert verbosity, severity anchoring, automation bias, accent/speech, image context, negative-KB overcorrection) is mitigated in code, not just named.", "tags": ["guardrails", "bias", "fairness"], "group": "guardrails", "sz": 35, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "Domain \u2014 Guardrails & Bias Mitigation", "resource": ".knowledge/domain-guardrails.md", "cid": "guardrails/.knowledge/domain-guardrails", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# Overview\n\nNine identified ways bias can enter the pipeline, each paired with a concrete mitigation \u2014 the last\nfour were self-identified by the team while building the voice/vision/negative-KB features, rather\nthan being generic checklist items.[^domain-guardrails]\n\n# Table\n\n| Bias | How it enters | Mitigation |\n|---|---|---|\n| Retrieval recency/frequency | RAG force-fits novel incidents to familiar root causes | Diversity-aware retrieval + an explicit \"no strong precedent found\" state |\n| Instrumentation/documentation | Well-monitored services get higher-confidence diagnoses | Confidence scored relative to evidence available for that CI + a \"low observability coverage\" flag |\n| Historical assignment | Routing to whoever historically closed similar tickets entrenches mis-routing | Route to role/queue, never a named individual; reason shown and editable |\n| Alert-verbosity | Terse legacy alerts under-ranked vs rich modern ones | Every signal normalized into `MaintenanceSignal` before any model ranks it |\n| Severity anchoring | Vendor-labelled priority anchors model judgement | Priority recomputed from CI criticality + blast radius + SLA; disagreement shown as a delta |\n| Automation bias (reviewer) | A confident-looking plan gets rubber-stamped | Approval screen shows the strongest counter-hypothesis + evidence gaps; reason mandatory on reject/edit; near-100% approval rate is treated as a warning sign, not a success metric |\n| Accent/speech-pattern | ASR is worse for non-native/atypical speech, so an accessibility feature becomes inaccessible | Command-scoped closed vocabulary (never free dictation); parsed intent shown for confirmation before executing; full keyboard parity \u2014 see [Voice Intake](/intake/voice-intake.md) |\n| Image-context | Modern dashboards extract cleanly; terminal dumps/legacy UIs extract poorly | Extraction confidence surfaced; mandatory human confirmation before a signal enters a workflow \u2014 see [Vision Intake](/intake/vision-intake.md) |\n| Negative-KB overcorrection | A remediation that failed once in one context gets blanket-suppressed everywhere | Entries scoped to `(ci_class, failure_signature)`, shown as a caution with reason, never a silent filter \u2014 see [Knowledge Agent](/agents/knowledge-agent.md) |\n\n[^domain-guardrails]\n\n[^domain-guardrails]: Domain \u2014 Guardrails & Bias Mitigation"}, {"id": "guardrails/blast-radius", "type": "Module", "title": "Blast Radius", "description": "Deterministic BFS over the CMDB relationship adjacency graph, computing how many CIs a proposed action could plausibly affect. Feeds the policy gate's block/approval thresholds directly.", "tags": ["guardrails", "deterministic", "cmdb"], "group": "guardrails",
