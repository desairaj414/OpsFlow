"sz": 30, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/guardrails/blast_radius.py", "resource": "backend/guardrails/blast_radius.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}], "body": "# Overview\n\n`compute_blast_radius(ci_id, relationships, max_depth=2)` runs a breadth-first search out to\n`max_depth` hops over the CMDB relationship graph, returning the set of affected CI ids (never\nincluding the starting CI) and their count. Relationships are treated as **undirected** for this\npurpose \u2014 any recorded coupling (`depends_on`/`hosts`/`connects_to`/`replicates_to`) means an\naction on one CI can plausibly ripple to the other, regardless of which direction the edge was\nrecorded in.[^blast-radius-py]\n\n# Schema\n\n| Field | Meaning |\n|---|---|\n| `ci_id` | the CI the action targets |\n| `affected_ci_ids` | sorted list of CIs reachable within `max_depth` hops |\n| `count` | `len(affected_ci_ids)` \u2014 the number the policy gate's thresholds compare against |\n| `max_depth` | the hop limit used (default 2) |\n\n# Consumers\n\n[Planner Agent](/agents/planner-agent.md) computes this after the LLM drafts a plan, then feeds\n`count` into [Policy Gate](policy-gate.md)'s `BLAST_RADIUS_APPROVAL`/`BLAST_RADIUS_BLOCK` rules.\nNever delegated to the model \u2014 this is exactly the kind of graph computation the routing principle\n(see [Model Routing](/architecture/model-routing.md)) reserves for deterministic code.\n\n[^blast-radius-py]: backend/guardrails/blast_radius.py"}, {"id": "guardrails/chunking", "type": "Module", "title": "Structural Chunking", "description": "Splits runbooks/postmortems only on structural boundaries (numbered steps, headings), never on a character/token count \u2014 because a retrieved chunk of a runbook is an instruction toward a production action, and a chunk that drops a preceding \"only if X\" condition is dangerous, not just lossy.", "tags": ["guardrails", "rag", "chunking"], "group": "guardrails", "sz": 32, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/chunking.py", "resource": "backend/chunking.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}, {"title": "Domain \u2014 Guardrails & Bias Mitigation", "resource": ".knowledge/domain-guardrails.md", "cid": "guardrails/.knowledge/domain-guardrails", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# Overview\n\n`chunk_runbook(path)` splits only on `### Step N` headings \u2014 a numbered step is atomic, staying\nwhole even across a simulated page-break marker in the source document. `chunk_postmortem(path)`\nsplits on `## Heading` boundaries.[^chunking-py] Neither ever splits on a character/token budget.\n\n# Preamble inheritance\n\nThe rule that prevents the dangerous case in the description above: every prerequisites/warnings\nblock preceding a runbook's `## Steps` section is prepended to **every** step chunk from that\nrunbook (`Prerequisites: ... \\n\\n Step N: ...`), so a retrieved step never loses an \"only if X\"\ncondition just because it was retrieved in isolation from the rest of the document.[^chunking-py]\n\n# Metadata\n\nEvery chunk carries a `heading_path` (e.g. `RB-014 \u203a Steps \u203a Step 3`) so a citation resolves to a\nspecific step, and a `class` tag (`remediation`/`patching`/`tuning`) that\n[Planner Agent](/agents/planner-agent.md)'s `where={\"class\": runbook_class}` Chroma filter uses to\nscope retrieval to the right runbook family. `chunk_postmortem` also passes through any other\nfrontmatter keys unchanged (e.g. `doc_type` on a Knowledge Base article), so a caller can tag\nfreeform content without this function needing to know every possible tag in advance.\n\n# Verification\n\n`scripts/assert_chunks.py` fails the build if a chunk begins mid-step, a numbered list is split\nacross chunks, a chunk lacks a heading path, or a code block is broken \u2014 run against the full\nrunbook/postmortem set including one deliberate trap runbook whose step 4 spans a simulated page\nbreak, to prove the page-break marker is genuinely not treated as a split point.[^domain-guardrails]\n\n[^chunking-py]: backend/chunking.py\n[^domain-guardrails]: Domain \u2014 Guardrails & Bias Mitigation"}, {"id": "guardrails/policy-gate", "type": "Module", "title": "Policy Gate", "description": "Pure-Python, no-LLM rule engine deciding allow/needs_approval/block for a proposed action \u2014 change-freeze windows, blast radius, concurrent-change limits, required-approver role, and an absolute advisory-only rule for tuning workflows.", "tags": ["guardrails", "deterministic", "policy"], "group": "guardrails", "sz": 35, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/guardrails/policy_gate.py", "resource": "backend/guardrails/policy_gate.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}], "body": "# Overview\n\n`evaluate_policy(request, context) -> PolicyResult` is deterministic: the same request and context\nalways produce the same decision \u2014 auditable and provably consistent, which the guardrail\nexplicitly cannot be if any part of it goes through a model.[^policy-gate-py] Precedence: any BLOCK\nrule wins outright; else any NEEDS_APPROVAL rule applies; else ALLOW.\n\n# Rules\n\n| Rule | Trigger | Decision |\n|---|---|---|\n| `FREEZE_WINDOW` | requested time falls inside a change-freeze window for that environment | block |\n| `BLAST_RADIUS_BLOCK` | blast radius count exceeds the hard block threshold (default 15) | block |\n| `MAX_CONCURRENT_CHANGES` | active prod changes >= the concurrent-change limit (default 3) | block |\n| `BLAST_RADIUS_APPROVAL` | blast radius count exceeds the approval threshold (default 5) but not the block threshold | needs_approval |\n| `ADVISORY_ONLY_WORKFLOW` | `action_type` is `tuning` | needs_approval, unconditionally \u2014 see below |\n| `REQUIRED_APPROVER_ROLE` | prod or P1 action, actor role not in `{sre_lead, change_manager}` | needs_approval |\n\n[^policy-gate-py]\n\n# Tuning is never auto-executable\n\n`ADVISORY_ONLY_ACTION_TYPES = {\"tuning\"}` is a hard rule inside the gate itself, not a UI\nconvention \u2014 Performance Tuning workflows always route through `needs_approval` regardless of how\nlow the blast radius or how senior the actor role, matching the\n[Workflow Families](/workflows/workflow-families.md) parity table's \"advisory only, never\nauto-executes\" row.\n\n# Runtime-editable thresholds\n\nThe three numeric thresholds (`blast_radius_approval_threshold`, `blast_radius_block_threshold`,\n`max_concurrent_changes_prod`) live in a module-level `_current_thresholds` dict, editable at\nruntime via the admin-only Model & Threshold Config panel (`GET`/`POST /config/thresholds`).\nDeliberately **in-memory only** \u2014 an admin's change takes effect immediately for subsequent runs in\nthis process but does not persist across a backend restart, the same \"live status, no persistence\"\nsimplification used for the autonomy ladder.[^policy-gate-py]\n\n# Consumers\n\nCalled from [Planner Agent](/agents/planner-agent.md) after the LLM drafts a plan, never before or\nduring \u2014 the model never sees or influences the gate's inputs.\n\n[^policy-gate-py]: backend/guardrails/policy_gate.py"}, {"id": "guardrails/scrubber", "type": "Module", "title": "Scrubber", "description": "PII/secrets redaction pipeline \u2014 a regex pass for structured identifiers/secrets plus a local-only Ollama SLM pass for free-text person names \u2014 with reversible tokenisation and a separate prompt-injection flag.", "tags": ["guardrails", "privacy", "pii"], "group": "guardrails", "sz": 37, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/guardrails/scrubber.py", "resource": "backend/guardrails/scrubber.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}, {"title": "Domain \u2014 Privacy, Scrubbing & Audit", "resource": ".knowledge/domain-privacy.md", "cid": "guardrails/.knowledge/domain-privacy", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# Overview\n\n`scrub(text, use_slm=True) -> ScrubResult` runs before any text reaches a hosted model boundary \u2014\nafter modality conversion (transcription/extraction), before anything else touches it, including\nintent parsing.[^domain-privacy] Two passes:\n\n1. **Regex** \u2014 structured items in priority order (connection strings and API keys/bearer tokens\n   matched before bare IP/email patterns, so a connection string is redacted whole rather than\n   partially matched inside): connection strings, API keys, bearer tokens, emails, employee IDs,\n   private IPs, internal hostnames, phone numbers.[^scrubber-py]\n2. **Local SLM** (Ollama, `llama-3.2-3b-it`, localhost only) \u2014 free-text person names regex can't\n   reliably catch. \"Highest-sensitivity content never leaves the machine\" is a privacy\n   *architecture* choice here, not a cost optimization.[^domain-privacy] If Ollama is unreachable,\n   this pass fails closed (returns the regex-only result, `slm_pass_ran=False`) rather than raising.\n\n# Reversible tokenisation\n\nEach detected item becomes a token like `[HOST_7]` or `[NAME_1]`, mapped in `token_map` back to the\noriginal value. `restore_text()` reconstructs the original for an authorized human viewer only \u2014\nnever called to reconstruct text sent to a model.[^scrubber-py]\n\n# Prompt-injection flag, not a redaction\n\nA separate `injection_suspected` boolean fires on patterns like \"ignore previous instructions\" or\n\"you are now in developer mode.\" This is a **flag**, not a redaction \u2014 containment of an actual\ninjection attempt is the typed-contract boundary's job downstream (a model's raw output never\nshort-circuits into an executed action), not something this module claims to solve alone.[^scrubber-py]\n\n# Measured accuracy\n\nAgainst a 31-item planted ground truth (`data/pii_ground_truth.json`): regex-covered types measured\n100% recall (20/20) with zero type confusion; the local-SLM name pass measured 100% recall (10/10)\nin the run recorded in `.knowledge/domain-privacy.md` \u2014 noted there as inherently probabilistic and\nworth re-measuring if the local model changes; the adversarial prompt-injection line was flagged\ncorrectly with zero false positives on clean snippets.[^domain-privacy]\n\n# Consumers\n\n[Voice Intake](/intake/voice-intake.md) and [Vision Intake](/intake/vision-intake.md) both call\n`scrub()` immediately after transcription/extraction, before intent parsing or CI-reference\nextraction. The core agent chain itself never calls the scrubber \u2014 its inputs are synthetic,\nalready-clean seeded data.\n\n[^scrubber-py]: backend/guardrails/scrubber.py\n[^domain-privacy]: Domain \u2014 Privacy, Scrubbing & Audit"}, {"id": "intake/vision-intake", "type": "Module", "title": "Vision Intake", "description": "Screenshot/error-image -> vision-model extraction -> scrub -> MaintenanceSignal, cited thereafter as IMG-nnn so provenance survives into diagnosis. Human confirmation is unconditional for every image signal.", "tags": ["intake", "vision", "multimodal"], "group": "intake", "sz": 31, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/intake/vision_path.py", "resource": "backend/intake/vision_path.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}, {"title": "Domain \u2014 Multimodal Intake", "resource": ".knowledge/domain-multimodal-intake.md", "cid": "intake/.knowledge/domain-multimodal-intake", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# Overview\n\n`run_vision_intake(image_bytes, mime_type)` sends the image plus an extraction prompt to the active\nprovider's `vision`-role model (see [Provider Registry](/architecture/provider-registry.md) \u2014 every\nregistered provider supports vision, unlike voice transcription), asking for error text,\nidentifiers, and timestamps as JSON. The combined extracted text is then scrubbed before anything\nelse touches it, and CI references (`CI-\\d{4,}` pattern) are parsed from the **scrubbed** text so a\nredaction can never accidentally remove or corrupt a real CI id used downstream.[^vision-path-py]\n\n# Unconditional confirmation\n\nUnlike voice (where only side-effecting intents require confirmation), every image signal sets\n`requires_human_confirmation=True` unconditionally \u2014 extraction confidence from a screenshot is\ntreated as inherently less trustworthy than a matched voice command, per\n[Bias Mitigation](/guardrails/bias-mitigation.md)'s image-context row (modern dashboards extract\ncleanly; terminal dumps and legacy UIs extract poorly).[^vision-path-py]\n\n# Consumers\n\n`orchestrator/intake_adapter.py`'s `start_workflow_from_confirmed_signal()` bridges a *confirmed*\nsignal into a real [Supervisor](/agents/supervisor.md) run \u2014 it enforces\n`requires_human_confirmation is False` in code before proceeding, not just as a UI convention; a\nsignal with no resolvable `candidate_ci_refs` is also rejected. The [Chat Widget](/architecture/cockpit-ui.md)'s\nimage-upload button is the current UI entry point for this path.\n\n[^vision-path-py]: backend/intake/vision_path.py"}, {"id": "intake/voice-intake", "type": "Module", "title": "Voice Intake", "description": "Audio -> Whisper (or provider-equivalent) transcription -> scrub -> a deterministic closed-vocabulary intent parser -> MaintenanceSignal. Scoped to 6 audited commands, never free-form dictation.", "tags": ["intake", "voice", "multimodal"], "group": "intake", "sz": 35, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "backend/intake/voice_path.py", "resource": "backend/intake/voice_path.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-11"}, {"title": "backend/intake/voice_intent.py", "resource": "backend/intake/voice_intent.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}, {"title": "Domain \u2014 Multimodal Intake", "resource": ".knowledge/domain-multimodal-intake.md", "cid": "intake/.knowledge/domain-multimodal-intake", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# Overview\n\n`run_voice_intake(audio_bytes, filename)` transcribes audio via the active provider's transcription\nendpoint (only providers with `supports_transcription: True` in the\n[Provider Registry](/architecture/provider-registry.md) offer this \u2014 currently only `tcs`; the\nfrontend hides the voice-intake UI for others, and the backend raises a clear error too, as defense\nin depth), then \u2014 critically \u2014 **scrubs the transcript before intent parsing**, per the\nscrub-after-convert, scrub-before-anything-else ordering.[^voice-path-py]\n\n# Closed-vocabulary intent parsing \u2014 deliberately not an LLM\n\n`parse_voice_intent()` (`backend/intake/voice_intent.py`) matches only 6 audited intents by regex:\n`show_open_incidents`, `show_incident \u003cid>`, `approve \u003cid>`, `reject \u003cid> with reason \u003ctext>`,\n`what_changed_on_ci \u003cid>`, `start_scenario \u003cname>`. Anything that doesn't match is\n`unrecognized` and flagged for human confirmation \u2014 never a silently-guessed best match. This list\nis not to be expanded without explicit human sign-off; it is a deliberate, audited scope,\nnot an incomplete feature.[^voice-intent-py] See\n[Model Routing](/architecture/model-routing.md) \u2014 the decisive reason is safety, not cost: a\nmisheard command reaching an approval action is unacceptable, so command-scope plus on-screen\nconfirmation is the chosen safety mechanism rather than smarter NLU.\n\n# Confirmation-before-action\n\n`approve_x`, `reject_x`, and `start_scenario` require on-screen confirmation before executing\n(`requires_human_confirmation`); read-only queries don't. Every voice action lands in the audit log\ntagged `modality: voice`.[^voice-intent-py]\n\n# What's real vs. recognized-but-unwired\n\nAs of this bundle's writing, `approve_x`/`reject_x` are wired to a real action (the audited\n`/workflows/decision` path). The other 4 intents are recognized and displayed on screen but not\nwired to an action \u2014 no incidents-list/scenario-library endpoint exists yet for them to act\nagainst; this is stated honestly in the UI rather than faked.\n\n# Consumers\n\nThe Sidebar's push-to-talk mic and the [Chat Widget](/architecture/cockpit-ui.md)'s mic button both\ngo through this same path \u2014 one pipeline, not two parsers.\n\n[^voice-path-py]: backend/intake/voice_path.py\n[^voice-intent-py]: backend/intake/voice_intent.py"}, {"id": "tools/mcp-tool-layer", "type": "System", "title": "MCP Tool Layer", "description": "One local MCP server per simulated external system (Monitoring, ITSM, Tracker, CMDB, Patch Source), exposing typed tools an agent calls instead of hand-rolled API glue.", "tags": ["mcp", "protocol", "integration"], "group": "tools", "sz": 36, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "API & Agent Contracts", "resource": ".knowledge/api-contract.md", "cid": "tools/.knowledge/api-contract", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}, {"title": "backend/mcp_servers/cmdb_mcp.py", "resource": "backend/mcp_servers/cmdb_mcp.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# Overview\n\nEach of Monitoring / ITSM / Tracker / CMDB / Patch Source exposes typed tools over MCP (Model\nContext Protocol) rather than bespoke HTTP calls scattered through agent code. Every server\n(`backend/mcp_servers/{monitoring,itsm,tracker,cmdb,patch}_mcp.py`, built on `mcp.server.fastmcp.FastMCP`)\nwraps a corresponding FastAPI simulator (`backend/mcp_servers/simulators/*.py`, ports 9001-9005) and\ncan run either as a real stdio-transport MCP server or, for tests/dev, self-test in-process over an\nASGI transport with no real port required.[^cmdb-mcp-py] Everything the app itself needs at runtime\nis wired in-process via `orchestrator/mcp_wiring.py` \u2014 the standalone ports only matter if a\nsimulator is run standalone.\n\n# Tool set per server\n\n| Server | Tools |\n|---|---|\n| Monitoring | `list_alerts`, `get_metric_series(ci_id)` |\n| ITSM | `create_ticket`, `update_ticket`, `add_work_note`, `get_ticket(sys_id)` |\n| Tracker | `create_issue`, `link_issue`, `transition_issue`, `get_issue` |\n| CMDB | `get_ci(id)`, `get_relationships(ci_id)`, `propose_ci_update` (records a proposal only \u2014 never mutates the CI directly) |\n| Patch Source | `get_pending_patches(ci_id)`, `get_change_calendar(scope)` \u2014 `scope` is `global`, an environment name, or a specific `ci_id`; the server always includes `global` windows alongside the requested scope |\n\n[^api-contract]\n\n# `propose_ci_update` never writes\n\nConfirmed by the CMDB MCP server's own self-test: after calling `propose_ci_update`, a follow-up\n`get_ci` shows the field unchanged \u2014 the human-approval gate for actually applying a CI update is\ndocumented as not yet built, not silently skipped.[^cmdb-mcp-py]\n\n# Why simulated systems, not real ones\n\nMonitoring/ITSM/Tracker/CMDB are OpsFlow's own FastAPI mocks \u2014 explicitly labelled as such in the\nUI, never presented as third-party SaaS. A real ServiceNow Personal Developer Instance was\nconsidered and rejected: it hibernates after roughly 24 hours, releases after 10 days, carries a\npossible waitlist and licence-framing risk, and a real instance can't produce on-demand scenarios\n(a 50-alert storm, 6-month CMDB drift, a planted credential) the way a simulator can. See\n[Decisions](/decisions/) for the full rejection record.\n\n# Consumers\n\n[Enrichment Agent](/agents/enrichment-agent.md) (CMDB, Monitoring, Patch Source), [Sync Agent](/agents/sync-agent.md)\n(ITSM, CMDB), [Supervisor](/agents/supervisor.md) (ITSM, to create the incident's ticket),\n[Planner Agent](/agents/planner-agent.md) (Patch Source, for maintenance-window scheduling).\n\n[^api-contract]: API & Agent Contracts"}, {"id": "workflows/workflow-families", "type": "Domain", "title": "Workflow Families \u2014 Incident, Patch, Performance Tuning", "description": "The same Supervisor + specialist agent chain and the same guardrails serve all three IT-ops workflow families, because the workflow is declarative YAML data, not three separate code paths.", "tags": ["domain", "workflows"], "group": "workflows", "sz": 37, "status": "stable", "stale_after": "", "generated": {"by": "claude-sonnet-5/okf-produce", "at": "2026-08-11T00:00:00Z"}, "verified": [], "sources": [{"title": "Domain \u2014 Three Workflow Families", "resource": ".knowledge/domain-workflows.md", "cid": "workflows/.knowledge/domain-workflows", "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}, {"title": "backend/orchestrator/workflows/incident.yaml", "resource": "backend/orchestrator/workflows/incident.yaml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": "2026-08-07"}], "body": "# Parity table\n\n| | Incident Resolution | Patch Management | Performance Tuning |\n|---|---|---|---|\n| Trigger | Fault alert / voice / image | Patch inventory + schedule | Degradation alert (latency, memory creep, slow query) |\n| Runbook class | `remediation` | `patching` | `tuning` |\n| Key evidence | Alerts, logs, CI graph, past incidents | Patch inventory, dependencies, change calendar | Metric trend, query stats, resource history |\n| Plan output | Remediation steps | Grouped maintenance window | Ranked tuning recommendations |\n| Verification criterion | Alert cleared **and** health probe recovered | Patch applied **and** no new alerts in window | Sustained metric improvement across a window \u2014 not a binary clear |\n| Autonomy tier | Up to auto-execute (ladder) | Approval required | **Advisory only \u2014 never auto-executes** |\n\n[^domain-workflows]\n\nPerformance tuning is deliberately advisory-only: tuning changes are judgement calls with delayed,\nambiguous effects, so this is a considered choice not to automate rather than a scope cut. Encoded\nas a hard rule in [Policy Gate](/guardrails/policy-gate.md), not left to a UI convention.\n\n# One chain, three YAML files\n\n`backend/orchestrator/workflows/{incident,patch,performance}.yaml` each declare the same 10-step\nchain (`correlate, enrichment, diagnosis, planner, policy_gate, approval, execute, verification,\nsync, knowledge`) and differ **only** in `runbook_class`, `verification_criterion`, and\n`autonomy_tier`.[^incident-yaml] Incident Resolution is the reference chain, built first; Patch\nManagement and Performance Tuning are derived from it. This derivation being nearly free (a new\nYAML file, zero new [Supervisor](/agents/supervisor.md) or agent code) was the confirmation that the\ndeclarative-workflow design assumption held \u2014 the explicit fallback plan, had it not been nearly\nfree, was to surface that as a design-assumption failure rather than silently hand-writing three\nseparate code paths.[^domain-workflows]\n\n# What actually differs at runtime\n\n[Enrichment Agent](/agents/enrichment-agent.md) takes a `workflow_type` parameter and only gathers\npatch-inventory/change-calendar evidence for `workflow_type == \"patch\"`.\n[Planner Agent](/agents/planner-agent.md) only computes a maintenance window\n(`guardrails/scheduling.py`) when `runbook_class == \"patching\"`. Everything else in the chain\n(Diagnosis, the policy gate's rule set, Verification's structure, Sync, Knowledge) runs unchanged\nacross all three families.\n\n[^domain-workflows]: Domain \u2014 Three Workflow Families\n[^incident-yaml]: backend/orchestrator/workflows/incident.yaml"}], EDGES=[{"source": "agents/a2a-handoff", "target": "decisions/one-a2a-handoff"}, {"source": "agents/a2a-handoff", "target": "agents/diagnosis-agent"}, {"source": "agents/diagnosis-agent", "target": "architecture/provider-registry"}, {"source": "agents/diagnosis-agent", "target": "agents/a2a-handoff"}, {"source": "agents/diagnosis-agent", "target": "decisions/no-workflow-checkpointing"}, {"source": "agents/diagnosis-agent", "target": "agents/planner-agent"}, {"source": "agents/diagnosis-agent", "target": "agents/supervisor"}, {"source": "agents/enrichment-agent", "target": "tools/mcp-tool-layer"}, {"source": "agents/enrichment-agent", "target": "architecture/model-routing"}, {"source": "agents/enrichment-agent", "target": "agents/diagnosis-agent"}, {"source": "agents/enrichment-agent", "target": "agents/supervisor"}, {"source": "agents/knowledge-agent", "target": "agents/verification-agent"}, {"source": "agents/knowledge-agent", "target": "guardrails/bias-mitigation"}, {"source": "agents/planner-agent", "target": "agents/diagnosis-agent"}, {"source": "agents/planner-agent", "target": "agents/supervisor"}, {"source": "agents/supervisor", "target": "workflows/workflow-families"}, {"source": "agents/supervisor", "target": "archit const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));

NODES.forEach(n=>{outL[n.id]=[];inL[n.id]=[];});
EDGES.forEach(e=>{outL[e.source].push(e.target);inL[e.target].push(e.source);});
const types=[...new Set(NODES.map(n=>n.type))].sort();
const color=Object.fromEntries(types.map((t,i)=>[t,PALETTE[i%PALETTE.length]]));
const off=new Set();
const cy=cytoscape({container:document.getElementById('cy'),minZoom:.2,maxZoom:1.6,wheelSensitivity:.2,
 elements:[...NODES.map(n=>({data:{...n,c:color[n.type]}})),...EDGES.map(e=>({data:e}))],
 style:[
  {selector:'node',style:{'background-color':'data(c)','label':'data(title)','color':'#e6e8ee',
   'font-size':10,'text-wrap':'wrap','text-max-width':120,'text-valign':'bottom','text-margin-y':4,
   'text-outline-width':2,'text-outline-color':'#0e0f13','min-zoomed-font-size':6,
   'width':'data(sz)','height':'data(sz)'}},
  {selector:'edge',style:{'width':1.2,'line-color':'#3a4150','target-arrow-color':'#3a4150',
   'target-arrow-shape':'triangle','arrow-scale':.8,'curve-style':'bezier','opacity':.7}},
  {selector:'.dim',style:{'opacity':.10}},{selector:'.hl',style:{'border-width':3,'border-color':'#fff'}}
 ],
 layout:{name:'cose',animate:false,nodeRepulsion:9000,idealEdgeLength:90,padding:40}});
const side=document.getElementById('side');
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function relList(title,arr){if(!arr.length)return'';
 return `<div class="rel"><h4>${title}</h4>${arr.map(id=>`<a data-go="${esc(id)}">${esc((byId[id]||{}).title||id)}</a>`).join('')}</div>`;}
// §5.3 — the trust tier is derived, never stored: no `verified` is unverified,
// `verified` by non-`human:` actors only is machine-confirmed, and any `human:`
// actor makes it human-reviewed. The exact lowercase prefix is the whole key.
// §5.5 — a concept is stale when today >= stale_after; both are YYYY-MM-DD, so
// a string compare is the whole comparison. Advisory signals, not access control.
const TODAY=new Date().toISOString().slice(0,10);
function trustTier(n){const v=n.verified||[];
 if(!v.length)return['t-unverified','unverified'];
 return v.some(e=>(e.by||'').startsWith('human:'))?['t-human','human-reviewed']
                                                  :['t-machine','machine-confirmed'];}
function badges(n){const [cls,label]=trustTier(n),out=[`<span class="badge ${cls}">${label}</span>`];
 if(n.stale_after&&TODAY>=n.stale_after)out.push(`<span class="badge b-stale">stale since ${esc(n.stale_after)}</span>`);
 if(n.status==='deprecated')out.push('<span class="badge b-deprecated">deprecated</span>');
 return `<div class="badges">${out.join('')}</div>`;}
// OKF v0.2 trust (§5.2) + lifecycle (§5.4/§5.5). A v0.1 `timestamp` arrives here
// as generated.at with an empty `by`, so legacy bundles still show a date.
function metaBlock(n){const g=n.generated||{},rows=[];
 if(n.status)rows.push(`<div>status <b>${esc(n.status)}</b></div>`);
 if(g.at||g.by)rows.push(`<div>generated${g.at?` <b>${esc(g.at)}</b>`:''}${g.by?` by ${esc(g.by)}`:''}</div>`);
 (n.verified||[]).forEach(v=>rows.push(`<div>verified${v.at?` <b>${esc(v.at)}</b>`:''}${v.by?` by ${esc(v.by)}`:''}</div>`));
 if(n.stale_after)rows.push(`<div>stale after <b>${esc(n.stale_after)}</b></div>`);
 return rows.length?`<div class="meta">${rows.join('')}</div>`:'';}
// Provenance (§5.1). A source may be another concept (graph link), an external
// URL, or a scope descriptor that is not followable at all.
function srcList(n){const s=n.sources||[];if(!s.length)return'';
 return `<div class="rel"><h4>Sources</h4>${s.map(x=>{
  const used=x.usage_count!=null?`used ${x.usage_count}×${x.usage_window?` (${x.usage_window})`:''}`:'';
  const sig=[x.author,used,x.last_modified].filter(Boolean).join(' · ');
  const label=esc(x.title||x.resource)+(sig?` <span class="sig">(${esc(sig)})</span>`:'');
  if(x.cid&&byId[x.cid])return `<a data-go="${esc(x.cid)}">${label}</a>`;
  if(/^https?:\/\//i.test(x.resource))return `<a href="${esc(x.resource)}" target="_blank" rel="noopener">${label}</a>`;
  return `<span class="empty">${label}</span>`;}).join('')}</div>`;}
// Resolve an in-body markdown link href to a concept id, mirroring build()'s
// resolution: strip #anchor, require .md, absolute strips leading /, relative
// resolves against the current concept's dir. Returns null if it's not a concept.
function resolveHref(cid,href){let t=(href||'').split('#')[0];if(!t.endsWith('.md'))return null;
 let tgt;if(t[0]==='/'){tgt=t.replace(/^\/+/,'').slice(0,-3);}
 else{const base=cid.split('/').slice(0,-1);
  for(const seg of t.slice(0,-3).split('/')){if(seg===''||seg==='.')continue;
   if(seg==='..'){if(!base.length)return null;base.pop();}else base.push(seg);}
  tgt=base.join('/');}
 return byId[tgt]?tgt:null;}
function show(id){const n=byId[id];if(!n)return;const c=color[n.type];
 side.innerHTML=`<span class="type" style="background:${c}">${esc(n.type)}</span>
 <h2>${esc(n.title)}</h2><div class="desc">${esc(n.description)||'<span class=empty>no description</span>'}</div>
 <div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
 ${badges(n)}${metaBlock(n)}${srcList(n)}${relList('Links to',outL[id])}${relList('Cited by',inL[id])}
 <div class="body">${n.body?DOMPurify.sanitize(marked.parse(n.body)):'<span class=empty>empty body</span>'}</div>`;
 side.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>select(a.getAttribute('data-go')));
 side.querySelectorAll('.body a[href]').forEach(a=>{const tgt=resolveHref(id,a.getAttribute('href'));
  if(tgt)a.onclick=e=>{e.preventDefault();select(tgt);};});}
function select(id){const ele=cy.getElementById(id);if(!ele.length)return;show(id);
 cy.elements().removeClass('hl').addClass('dim');const nb=ele.closedNeighborhood();nb.removeClass('dim');ele.addClass('hl');
 cy.animate({center:{eles:ele},duration:250});
 try{if(decodeURIComponent((location.hash||'').slice(1))!==id)location.hash=encodeURIComponent(id);}catch(e){}}
cy.on('tap','node',e=>select(e.target.id()));
cy.on('tap',e=>{if(e.target===cy)cy.elements().removeClass('dim hl');});
function applyFilter(){const q=document.getElementById('search').value.toLowerCase();const ty=document.getElementById('type').value;
 cy.batch(()=>cy.nodes().forEach(n=>{const d=n.data();
  const m=(!q||(d.title+' '+d.type+' '+d.description+' '+(d.tags||[]).join(' ')).toLowerCase().includes(q))
        &&(!ty||d.type===ty)&&!off.has(d.type);
  n.style('display',m?'element':'none');}));}
let debounce;
document.getElementById('search').oninput=()=>{clearTimeout(debounce);debounce=setTimeout(applyFilter,150);};
document.getElementById('type').oninput=applyFilter;
const tysel=document.getElementById('type');types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tysel.appendChild(o);});
let curLayout='cose';
document.getElementById('layout').onchange=e=>{const v=e.target.value;
 if(v==='cose'&&NODES.length>1000&&!confirm(`force layout on ${NODES.length} concepts can freeze this tab — run anyway?`)){e.target.value=curLayout;return;}
 curLayout=v;cy.layout({name:v,animate:true,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();};
document.getElementById('legend').innerHTML=types.map(t=>`<span class="chip" data-t="${esc(t)}"><span class="dot" style="background:${color[t]}"></span>${esc(t)} (${NODES.filter(n=>n.type===t).length})</span>`).join('');
document.querySelectorAll('#legend .chip').forEach(ch=>ch.onclick=()=>{const t=ch.getAttribute('data-t');
 if(off.has(t)){off.delete(t);ch.classList.remove('off');}else{off.add(t);ch.classList.add('off');}applyFilter();});
document.getElementById('layout').value='cose';
const Q=new URLSearchParams(location.search),QL=Q.get('layout'),QS=Q.get('select');
if(QL&&[...document.querySelectorAll('#layout option')].some(o=>o.value===QL)){document.getElementById('layout').value=QL;curLayout=QL;cy.layout({name:QL,animate:false,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();}
function fromHash(){try{const h=decodeURIComponent((location.hash||'').slice(1));if(h&&byId[h])select(h);}catch(e){}}
addEventListener('hashchange',fromHash);
if(QS&&byId[QS])select(QS);else fromHash();
</script></body></html>
