services:
  - type: web
    name: opsflow-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: >
      pip install -r requirements.txt &&
      python db/init_db.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # db/load_chroma.py deliberately does NOT run here. It re-embeds ~700 chunks through Gemini's
    # free-tier embeddings API, which is tightly rate-limited (real incident: a Render build failed
    # outright on repeated 429s, 2026-08-13) — expensive and flaky to redo on every deploy/restart
    # for data that never changes (frozen synthetic seed runbooks/postmortems/tickets). Instead
    # data/chroma_db/ is pre-built locally and committed to git (see .gitignore), so Render's build
    # just uses the already-populated index. Re-run `python db/load_chroma.py` locally and commit
    # the result only if the source runbooks/postmortems/tickets data ever actually changes.
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
        # Render defaults to its newest available Python (3.14 as of writing) when this isn't set,
        # which has no prebuilt wheel for pydantic-core==2.23.4 — pip falls back to compiling it
        # from source via Rust/maturin, which fails on Render's build sandbox (read-only Cargo
        # cache). Pinned to match backend/venv's locally-tested version (3.11.7). backend/runtime.txt
        # sets the same pin as a second signal Render's Python-runtime detection reads.
      - key: DEFAULT_PROVIDER
        value: gemini
      - key: TCS_NETWORK
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
        # Optional, but worth setting: api_client.py's get_llm() falls back to this key (never a
        # visitor's own BYOK key/provider) if Gemini fails during a Free Demo Key session — the only
        # step in that fallback chain actually reachable from here, since the Ollama step after it
        # needs a local Ollama process this hosted deploy doesn't have.
      - key: JWT_SECRET
        generateValue: true
      - key: A2A_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
        # Set this to the opsflow-frontend static site's actual URL after both services exist
        # (Render assigns the final <name>.onrender.com only once the service is created — if
        # "opsflow-frontend" collides with another Render user's service, yours gets a different
        # name/suffix). No rebuild needed after changing this — it's read from the environment at
        # request time (config.py), a restart is enough.
    # No persistent disk — Render's free Web Service tier doesn't support one (paid-plan add-on
    # only). The build command rebuilds SQLite + Chroma fresh on every deploy/restart from the
    # committed synthetic seed data, so the app always comes up consistent; the tradeoff is that
    # any live-run state (audit_log, local_tickets) from a BYOK/Free-Demo-Key session doesn't
    # survive a cold start (free tier sleeps after 15min idle) — acceptable for a public demo,
    # since Instant Demo mode (the always-works path) never touches this DB at request time anyway.

  - type: web
    name: opsflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
        # Set this to the opsflow-backend web service's actual URL after both services exist (same
        # naming-collision caveat as above). Unlike FRONTEND_ORIGIN, this DOES need a rebuild after
        # changing it — Next.js bakes NEXT_PUBLIC_* values into the static JS bundle at build time
        # (output: "export" in next.config.mjs), not read at runtime. Trigger a manual deploy on
        # this service after setting/changing it.
    # Free, unlimited, no idle-sleep tier (unlike the backend's free Web Service) — this is why the
    # frontend and backend are two separate service types on the same platform rather than one:
    # the backend genuinely needs a long-running process (SQLite + Chroma opened once, held across
    # requests, plus an SSE stream), which only Render's Web Service tier provides; the frontend has
    # zero server-side routes (frontend/src/app/ is a single client-rendered page) and gets a
    # strictly better free tier — always-warm, CDN-backed — by being a Static Site instead.
